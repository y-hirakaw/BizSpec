<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizSpec — process atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Surface (warm paper) ────────────────────────────── */
  --bg:              #F2EEE5;
  --bg-elevated:     #FBF8F1;
  --bg-card:         #FFFFFF;
  --bg-card-hover:   #FBF8F1;
  --bg-input:        #FBF8F1;
  --bg-overlay:      rgba(31, 26, 18, 0.03);

  /* ── Border (warm hairlines) ─────────────────────────── */
  --border:          #E5DFD0;
  --border-strong:   #D4CDB9;
  --border-glow:     rgba(194, 65, 12, 0.25);

  /* ── Text (warm neutrals) ────────────────────────────── */
  --text-primary:    #1F1A12;
  --text-secondary:  #6B6253;
  --text-muted:      #A09783;
  --text-inverse:    #FBF8F1;

  /* ── Accent (terracotta — warm, restrained) ──────────── */
  --accent:          #C2410C;
  --accent-dim:      #9A340A;
  --accent-soft:     rgba(194, 65, 12, 0.08);
  --accent-glow:     rgba(194, 65, 12, 0.18);

  /* ── Lifecycle status (light, retuned for paper) ─────── */
  --status-draft-bg:        #FBF4DC;
  --status-draft-border:    #B59308;
  --status-draft-fg:        #6E5403;
  --status-review-bg:       #FBE9D6;
  --status-review-border:   #C2410C;
  --status-review-fg:       #7A2C0A;
  --status-stable-bg:       #ECF1E0;
  --status-stable-border:   #5F8C40;
  --status-stable-fg:       #2F4D1B;
  --status-deprecated-bg:   #ECE6D8;
  --status-deprecated-border:#C7BFAE;
  --status-deprecated-fg:   #8B8270;

  /* ── Heatmap (light, distinct from status) ───────────── */
  --heat-low-bg:        #FBF6DA;
  --heat-low-border:    #DBA91F;
  --heat-low-fg:        #7A5A04;
  --heat-medium-bg:     #FBE5C8;
  --heat-medium-border: #D27319;
  --heat-medium-fg:     #92420C;
  --heat-high-bg:       #FBDDD2;
  --heat-high-border:   #B5482E;
  --heat-high-fg:       #7A1F08;

  /* ── Executor type (muted ink tones) ─────────────────── */
  --exec-script-bg:    rgba(30, 64, 175, 0.07);
  --exec-script-fg:    #1E40AF;
  --exec-script-border:rgba(30, 64, 175, 0.22);
  --exec-ai_agent-bg:    rgba(109, 40, 217, 0.07);
  --exec-ai_agent-fg:    #5B21B6;
  --exec-ai_agent-border:rgba(109, 40, 217, 0.22);
  --exec-manual-bg:    rgba(87, 83, 78, 0.07);
  --exec-manual-fg:    #57534E;
  --exec-manual-border:rgba(87, 83, 78, 0.20);

  /* ── Edges ───────────────────────────────────────────── */
  --edge-seq:         #B0A892;
  --edge-skip:        #C2410C;
  --edge-parallel:    #5F8C40;
  --edge-cross:       #C2410C;
  --edge-highlight:   #C2410C;

  /* ── Typography ──────────────────────────────────────── */
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:    'IBM Plex Sans', -apple-system, BlinkMacSystemFont,
                  'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;

  /* ── Motion ──────────────────────────────────────────── */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.55;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "ss02";
}

body {
  height: 100vh;
  display: flex;
  overflow: hidden;
  /* subtle film grain to add tactile texture */
  position: relative;
}

body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1000;
  opacity: 0.05;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
}

::selection { background: var(--accent); color: var(--text-inverse); }

/* ── Sidebar ────────────────────────────────────────────── */
#sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  position: relative;
}
.sb-logo {
  padding: 22px 22px 18px;
  border-bottom: 1px solid var(--border);
}
.sb-logo-mark {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  font-style: italic;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1;
}
.sb-logo-tag {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  margin-top: 6px;
}
.sb-section {
  padding: 22px 22px 8px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sb-section::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}
#proc-nav { padding: 4px 0 16px; }
.sb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 22px 8px 22px;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-secondary);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: color .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
  position: relative;
}
.sb-item:hover {
  color: var(--text-primary);
  background: var(--bg-elevated);
}
.sb-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: linear-gradient(90deg, var(--accent-soft) 0%, transparent 60%);
}
.sb-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.sb-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  font-weight: 400;
  flex-shrink: 0;
  min-width: 22px;
  text-align: right;
}
.sb-item.active .sb-count { color: var(--accent); }
.sb-foot {
  margin-top: auto;
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ── Main column ───────────────────────────────────────── */
#main {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: var(--bg);
}

/* ── Top bar ───────────────────────────────────────────── */
#topbar {
  flex: 0 0 auto;
  height: 60px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
  position: relative;
}
#back-btn {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 11.5px;
  font-family: var(--font-mono);
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  cursor: pointer;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: transparent;
  transition: color .15s var(--ease), border-color .15s var(--ease);
}
#back-btn:hover { color: var(--accent); border-color: var(--accent); }
#topbar-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  line-height: 1;
}
#topbar-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  margin-left: 4px;
  align-self: end;
  margin-bottom: 4px;
}

/* ── Content area ──────────────────────────────────────── */
#content {
  flex: 1 1 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Overview ──────────────────────────────────────────── */
#overview-view {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 36px 36px 80px;
  background: var(--bg);
  /* hairline grid wash */
  background-image:
    linear-gradient(var(--bg-overlay) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-overlay) 1px, transparent 1px);
  background-size: 40px 40px;
}
#overview-wrap { position: relative; max-width: 1480px; margin: 0 auto; }
#overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 22px;
  position: relative;
  z-index: 2;
}
#overview-edges {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: visible;
}

.proc-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 20px 20px 16px;
  cursor: pointer;
  transition: border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease);
  display: flex;
  flex-direction: column;
  height: 180px;
  position: relative;
  overflow: hidden;
}
/* corner accent (top-left tick) */
.proc-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 18px; height: 1px;
  background: var(--text-muted);
  transition: width .35s var(--ease), background .25s var(--ease);
}
.proc-card::after {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 1px; height: 18px;
  background: var(--text-muted);
  transition: height .35s var(--ease), background .25s var(--ease);
}
.proc-card:hover {
  border-color: var(--accent);
  background: var(--bg-card-hover);
}
.proc-card:hover::before { width: 36px; background: var(--accent); }
.proc-card:hover::after  { height: 36px; background: var(--accent); }

.proc-card-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
}
.proc-card-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.012em;
  color: var(--text-primary);
  flex: 1;
  min-width: 0;
  word-break: break-all;
  line-height: 1.2;
}
.proc-card-count-inline {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  flex-shrink: 0;
  letter-spacing: 0.05em;
}
.proc-card-slug {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 12px;
  letter-spacing: 0.05em;
}
.proc-card-mini {
  flex: 1 1 0;
  min-height: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 6px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.proc-card-mini svg { display: block; max-width: 100%; max-height: 100%; }
.proc-card-mini-empty {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}
.proc-card-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 12px;
}
.pill {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  padding: 2px 7px;
  letter-spacing: 0.04em;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill-script   { background: var(--exec-script-bg);   color: var(--exec-script-fg);   border-color: var(--exec-script-border); }
.pill-ai_agent { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); border-color: var(--exec-ai_agent-border); }
.pill-manual   { background: var(--exec-manual-bg);   color: var(--exec-manual-fg);   border-color: var(--exec-manual-border); }
.pill-phase    { background: transparent; color: var(--text-secondary); border-color: var(--border-strong); }
.proc-card-footer {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  letter-spacing: 0.04em;
}
.proc-card-deps {
  font-size: 10.5px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.04em;
}

/* ── Overview display mode toggle ──────────────────────── */
#ov-mode-toggle {
  margin-left: auto;
  display: flex;
  gap: 0;
  border: 1px solid var(--border-strong);
}
.ov-mode-btn {
  padding: 6px 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: background .15s var(--ease), color .15s var(--ease);
}
.ov-mode-btn:not(:last-child) { border-right: 1px solid var(--border-strong); }
.ov-mode-btn.active {
  background: var(--accent);
  color: var(--text-inverse);
}
.ov-mode-btn:hover:not(.active) { color: var(--text-primary); background: var(--bg-elevated); }

/* Mode visibility */
#overview-grid.mode-info .proc-card-mini { display: none; }
#overview-grid.mode-flow .proc-card-slug,
#overview-grid.mode-flow .proc-card-pills,
#overview-grid.mode-flow .proc-card-footer,
#overview-grid.mode-flow .proc-card-count-inline { display: none; }
#overview-grid.mode-flow .proc-card-mini { margin-bottom: 0; }

/* ── Flow view ─────────────────────────────────────────── */
#flow-view {
  flex: 1 1 0;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
#flow-legend {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 8px 28px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.lswatch {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  border: 1px solid var(--border-strong);
}
.lpill {
  height: 16px;
  padding: 0 7px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  border: 1px solid transparent;
}

#flow-body {
  flex: 1 1 0;
  display: flex;
  min-height: 0;
}
#flow-area {
  flex: 0 0 auto;
  min-width: 360px;
  max-width: 60vw;
  overflow: auto;
  background: var(--bg);
  border-right: 1px solid var(--border);
  padding: 32px 28px 60px;
  background-image:
    linear-gradient(var(--bg-overlay) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-overlay) 1px, transparent 1px);
  background-size: 40px 40px;
}
#flow-canvas { position: relative; }
svg.arrows-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}

/* Node */
.node {
  position: absolute;
  width: 200px;
  height: 54px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  padding: 8px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  transition: border-color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
  user-select: none;
  font-family: var(--font-body);
}
.node:hover {
  border-color: var(--accent);
  background: var(--bg-card-hover);
}
.node.selected {
  border-color: var(--accent);
  background: var(--bg-card-hover);
  box-shadow: 0 0 0 1px var(--accent), 0 0 24px -4px var(--accent-glow);
  z-index: 5;
}
.node.core-true  { border-left-width: 3px; border-left-color: var(--accent); }
.node.core-false { border-left-width: 3px; border-left-color: var(--text-muted); }

/* Heatmap (cost-derived). Border-left already used by core marker; we tint the right edge / bg. */
.node.heat-low    { background: var(--heat-low-bg)    !important; border-color: var(--heat-low-border)    !important; }
.node.heat-medium { background: var(--heat-medium-bg) !important; border-color: var(--heat-medium-border) !important; }
.node.heat-high   { background: var(--heat-high-bg)   !important; border-color: var(--heat-high-border)   !important; }

/* Lifecycle status overrides heatmap when present (intent > cost) */
.node.status-draft      { background: var(--status-draft-bg)      !important; border-color: var(--status-draft-border)      !important; }
.node.status-review     { background: var(--status-review-bg)     !important; border-color: var(--status-review-border)     !important; }
.node.status-stable     { background: var(--status-stable-bg)     !important; border-color: var(--status-stable-border)     !important; }
.node.status-deprecated {
  background: var(--status-deprecated-bg) !important;
  border-color: var(--status-deprecated-border) !important;
  opacity: 0.55;
}
.node.status-deprecated .node-name { text-decoration: line-through; }

.node-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.3;
  letter-spacing: -0.005em;
}
.node-badges { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  padding: 1px 5px;
  white-space: nowrap;
  line-height: 1.5;
  letter-spacing: 0.04em;
  border: 1px solid transparent;
}
.badge-script   { background: var(--exec-script-bg);   color: var(--exec-script-fg);   border-color: var(--exec-script-border); }
.badge-ai_agent { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); border-color: var(--exec-ai_agent-border); }
.badge-manual   { background: var(--exec-manual-bg);   color: var(--exec-manual-fg);   border-color: var(--exec-manual-border); }
.badge-core     { background: var(--accent-soft);      color: var(--accent);           border-color: var(--accent); }
.badge-heat-low    { background: transparent; color: var(--heat-low-fg);    border-color: var(--heat-low-border); }
.badge-heat-medium { background: transparent; color: var(--heat-medium-fg); border-color: var(--heat-medium-border); }
.badge-heat-high   { background: transparent; color: var(--heat-high-fg);   border-color: var(--heat-high-border); }

/* ── Detail panel ──────────────────────────────────────── */
#detail-panel {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 32px 36px 60px;
  background: var(--bg-elevated);
  min-width: 0;
}
.detail-empty {
  height: 100%;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.detail-header {
  padding-bottom: 20px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
}
.detail-unit-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: -0.018em;
  color: var(--text-primary);
  margin-bottom: 10px;
  word-break: break-all;
}
.detail-aim {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 14px;
}
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  padding: 2px 9px;
  border: 1px solid transparent;
  letter-spacing: 0.04em;
}
.tag-phase      { background: transparent; color: var(--text-secondary); border-color: var(--border-strong); }
.tag-core-true  { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tag-core-false { background: transparent; color: var(--text-muted); border-color: var(--border-strong); }
.tag-script     { background: var(--exec-script-bg);   color: var(--exec-script-fg);   border-color: var(--exec-script-border); }
.tag-ai_agent   { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); border-color: var(--exec-ai_agent-border); }
.tag-manual     { background: var(--exec-manual-bg);   color: var(--exec-manual-fg);   border-color: var(--exec-manual-border); }
.tag-status-draft      { background: transparent; color: var(--status-draft-fg);      border-color: var(--status-draft-border); }
.tag-status-review     { background: transparent; color: var(--status-review-fg);     border-color: var(--status-review-border); }
.tag-status-stable     { background: transparent; color: var(--status-stable-fg);     border-color: var(--status-stable-border); }
.tag-status-deprecated { background: transparent; color: var(--status-deprecated-fg); border-color: var(--status-deprecated-border); }

.section { margin-bottom: 26px; }
.section-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::before {
  content: "";
  display: inline-block;
  width: 14px;
  height: 1px;
  background: var(--accent);
}
.item-list {
  list-style: none;
  padding: 0;
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.75;
}
.item-list li {
  padding-left: 18px;
  position: relative;
}
.item-list li::before {
  content: "→";
  position: absolute;
  left: 0;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  top: 5px;
}
.io-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.io-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 12px 14px;
}
.io-box-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin-bottom: 8px;
  color: var(--text-muted);
}
.io-box-in      .io-box-label { color: var(--exec-script-fg); }
.io-box-process .io-box-label { color: var(--exec-ai_agent-fg); }
.io-box-out     .io-box-label { color: var(--status-stable-fg); }
.io-box ul {
  list-style: none;
  padding: 0;
  font-size: 11.5px;
  color: var(--text-secondary);
  line-height: 1.65;
}
.io-box ul li {
  padding-left: 11px;
  position: relative;
}
.io-box ul li::before {
  content: "·";
  position: absolute;
  left: 0;
  color: var(--text-muted);
}

.executor-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 14px;
}
.executor-reason {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-top: 8px;
  line-height: 1.65;
}

.deprecated-banner {
  font-size: 12.5px;
  color: var(--status-deprecated-fg);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--status-review-border);
  padding: 10px 14px;
  line-height: 1.6;
}

.link-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 10px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  cursor: pointer;
  transition: background .15s var(--ease), color .15s var(--ease);
  letter-spacing: 0.02em;
}
.link-chip:hover { background: var(--accent); color: var(--text-inverse); }
.link-chip-ext {
  background: transparent;
  color: var(--exec-ai_agent-fg);
  border-color: var(--exec-ai_agent-border);
  cursor: default;
}
.link-chip-ext:hover { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); }
.link-empty {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

.meta-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.meta-item {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 14px;
  min-width: 130px;
}
.meta-key {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.meta-val {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 0.01em;
}
.meta-diff-low    { color: var(--status-stable-fg); }
.meta-diff-medium { color: var(--status-review-fg); }
.meta-diff-high   { color: var(--heat-high-fg); }

/* ── Filter bar ────────────────────────────────────────── */
#flow-filter-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 28px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  margin-right: 4px;
}
.filter-btn {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 10px;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-secondary);
  transition: color .15s var(--ease), border-color .15s var(--ease), background .15s var(--ease);
  line-height: 1.5;
  letter-spacing: 0.05em;
}
.filter-btn:hover {
  color: var(--text-primary);
  border-color: var(--text-secondary);
}
.filter-btn.active {
  background: var(--accent);
  color: var(--text-inverse);
  border-color: var(--accent);
}
.filter-search {
  font-family: var(--font-mono);
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-primary);
  outline: none;
  width: 160px;
  letter-spacing: 0.04em;
}
.filter-search:focus { border-color: var(--accent); }
.filter-search::placeholder { color: var(--text-muted); }

/* ── Scrollbars (subtle) ──────────────────────────────── */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-strong); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-mark">BizSpec</div>
    <div class="sb-logo-tag">Process Atlas</div>
  </div>
  <div class="sb-section">Processes</div>
  <nav id="proc-nav"></nav>
  <div class="sb-foot">
    <span>v0.1</span>
    <span>BIZSPEC.YAML</span>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <button id="back-btn" onclick="showOverview()">← Index</button>
    <span id="topbar-title">All Processes</span>
    <span id="topbar-sub"></span>
    <div id="ov-mode-toggle">
      <button class="ov-mode-btn active" data-mode="info">Info</button>
      <button class="ov-mode-btn" data-mode="flow">Flow</button>
    </div>
  </div>
  <div id="content">
    <div id="overview-view">
      <div id="overview-wrap">
        <svg id="overview-edges"></svg>
        <div id="overview-grid"></div>
      </div>
    </div>
    <div id="flow-view">
      <div id="flow-legend">
        <div class="legend-item"><div class="lswatch" style="background:#FFFFFF;border-left:3px solid #C2410C;"></div>core: true</div>
        <div class="legend-item"><div class="lswatch" style="background:#FBF8F1;border-left:3px solid #A09783;"></div>core: false</div>
        <div class="legend-item"><div class="lpill" style="background:rgba(30, 64, 175, 0.07);color:#1E40AF;border-color:rgba(30, 64, 175, 0.22);">script</div></div>
        <div class="legend-item"><div class="lpill" style="background:rgba(109, 40, 217, 0.07);color:#5B21B6;border-color:rgba(109, 40, 217, 0.22);">ai_agent</div></div>
        <div class="legend-item"><div class="lpill" style="background:rgba(87, 83, 78, 0.07);color:#57534E;border-color:rgba(87, 83, 78, 0.20);">manual</div></div>
        <div class="legend-item" id="idx-status-legend" style="display:none;gap:5px;">
          <span style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);letter-spacing:0.12em;">STATUS:</span>
          <div class="lswatch" style="background:#FBF4DC;border-color:#B59308;" title="draft"></div>
          <div class="lswatch" style="background:#FBE9D6;border-color:#C2410C;" title="review"></div>
          <div class="lswatch" style="background:#ECF1E0;border-color:#5F8C40;" title="stable"></div>
          <div class="lswatch" style="background:#ECE6D8;border-color:#C7BFAE;" title="deprecated"></div>
        </div>
      </div>
      <div id="flow-filter-bar">
        <div class="filter-group">
          <span class="filter-label">Core</span>
          <button class="filter-btn active" data-filter="core" data-val="all">all</button>
          <button class="filter-btn" data-filter="core" data-val="true">true</button>
          <button class="filter-btn" data-filter="core" data-val="false">false</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">Executor</span>
          <button class="filter-btn active" data-filter="executor" data-val="all">all</button>
          <button class="filter-btn" data-filter="executor" data-val="script">script</button>
          <button class="filter-btn" data-filter="executor" data-val="ai_agent">ai_agent</button>
          <button class="filter-btn" data-filter="executor" data-val="manual">manual</button>
        </div>
        <div class="filter-group" id="idx-phase-filter" style="display:none;">
          <span class="filter-label">Phase</span>
          <button class="filter-btn active" data-filter="phase" data-val="all">all</button>
        </div>
        <div class="filter-group" id="idx-status-filter" style="display:none;">
          <span class="filter-label">Status</span>
          <button class="filter-btn active" data-filter="status" data-val="all">all</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">Search</span>
          <input type="search" class="filter-search" id="idx-filter-search" placeholder="unit / aim…">
        </div>
      </div>
      <div id="flow-body">
        <div id="flow-area"><div id="flow-canvas"></div></div>
        <div id="detail-panel"><div class="detail-empty">Select a node</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const ALL_DATA   = __ALL_DATA_JSON__;
const CROSS_EDGES = __CROSS_EDGES_JSON__;

const W = 200, H = 54;
const NS = "http://www.w3.org/2000/svg";

/* ── Color tokens consumed by SVG (kept in sync with CSS vars) ── */
const COLOR = {
  /* lifecycle */
  DRAFT_BG:        "#FBF4DC", DRAFT_BORDER:        "#B59308",
  REVIEW_BG:       "#FBE9D6", REVIEW_BORDER:       "#C2410C",
  STABLE_BG:       "#ECF1E0", STABLE_BORDER:       "#5F8C40",
  DEPRECATED_BG:   "#ECE6D8", DEPRECATED_BORDER:   "#C7BFAE",
  /* heatmap */
  HEAT_LOW_BG:     "#FBF6DA", HEAT_LOW_BORDER:     "#DBA91F",
  HEAT_MED_BG:     "#FBE5C8", HEAT_MED_BORDER:     "#D27319",
  HEAT_HIGH_BG:    "#FBDDD2", HEAT_HIGH_BORDER:    "#B5482E",
  /* core fallback */
  CORE_TRUE_BG:    "#FFFFFF", CORE_TRUE_BORDER:    "#C2410C",
  CORE_FALSE_BG:   "#FBF8F1", CORE_FALSE_BORDER:   "#A09783",
  NEUTRAL_BG:      "#FBF8F1", NEUTRAL_BORDER:      "#D4CDB9",
  /* edges */
  EDGE_SEQ:        "#B0A892",
  EDGE_SKIP:       "#C2410C",
  EDGE_PARALLEL:   "#5F8C40",
  EDGE_CROSS:      "#C2410C",
  EDGE_HIGHLIGHT:  "#C2410C",
};

// ── Color mapping (used by SVG mini flows) ────────────────
function nodeColors(u, heat) {
  if (!u) return { fill: COLOR.NEUTRAL_BG, stroke: COLOR.NEUTRAL_BORDER };
  if (u.lifecycle_status === "deprecated") return { fill: COLOR.DEPRECATED_BG, stroke: COLOR.DEPRECATED_BORDER, opacity: 0.55 };
  if (u.lifecycle_status === "draft")      return { fill: COLOR.DRAFT_BG,    stroke: COLOR.DRAFT_BORDER };
  if (u.lifecycle_status === "review")     return { fill: COLOR.REVIEW_BG,   stroke: COLOR.REVIEW_BORDER };
  if (u.lifecycle_status === "stable")     return { fill: COLOR.STABLE_BG,   stroke: COLOR.STABLE_BORDER };
  if (heat === "low")    return { fill: COLOR.HEAT_LOW_BG,  stroke: COLOR.HEAT_LOW_BORDER };
  if (heat === "medium") return { fill: COLOR.HEAT_MED_BG,  stroke: COLOR.HEAT_MED_BORDER };
  if (heat === "high")   return { fill: COLOR.HEAT_HIGH_BG, stroke: COLOR.HEAT_HIGH_BORDER };
  return u.core ? { fill: COLOR.CORE_TRUE_BG,  stroke: COLOR.CORE_TRUE_BORDER }
                : { fill: COLOR.CORE_FALSE_BG, stroke: COLOR.CORE_FALSE_BORDER };
}

// ── Mini flow inside each card ────────────────────────────
function buildCardMini(proc) {
  const { positions, edges, canvasW, canvasH, units } = proc;
  if (!positions || !Object.keys(positions).length) return null;
  const heat = computeHeat(units);

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${canvasW} ${canvasH}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", "100%");

  edges.forEach(([from, to, etype]) => {
    const fp = positions[from], tp = positions[to];
    if (!fp || !tp) return;
    const isParallel = etype === "parallel";
    let d;
    if (isParallel) {
      const fx = fp.left + W/2, fy = fp.top + H/2;
      const tx = tp.left + W/2, ty = tp.top + H/2;
      const my = (fy + ty) / 2;
      d = `M ${fx} ${fy} C ${fx} ${my} ${tx} ${my} ${tx} ${ty}`;
    } else {
      const fx = fp.left + W/2, fy = fp.top + H;
      const tx = tp.left + W/2, ty = tp.top;
      const my = (fy + ty) / 2;
      d = `M ${fx} ${fy} C ${fx} ${my} ${tx} ${my} ${tx} ${ty}`;
    }
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", isParallel ? COLOR.EDGE_PARALLEL : COLOR.EDGE_SEQ);
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("stroke-dasharray", isParallel ? "4 3" : "none");
    path.setAttribute("fill", "none");
    svg.appendChild(path);
  });

  Object.entries(positions).forEach(([uname, pos]) => {
    const u = units[uname];
    const c = nodeColors(u, heat[uname]);
    const rect = document.createElementNS(NS, "rect");
    Object.entries({
      x: pos.left, y: pos.top, width: W, height: H,
      rx: 0, ry: 0,
      fill: c.fill, stroke: c.stroke, "stroke-width": "2",
    }).forEach(([k, v]) => rect.setAttribute(k, v));
    if (c.opacity != null) rect.setAttribute("opacity", c.opacity);
    svg.appendChild(rect);
  });

  return svg;
}

// ── Cross-process edges between cards ─────────────────────
function renderOverviewEdges() {
  const svg  = document.getElementById("overview-edges");
  const grid = document.getElementById("overview-grid");
  if (!svg || !grid) return;
  svg.innerHTML = "";

  const gridRect = grid.getBoundingClientRect();
  if (gridRect.width <= 0 || gridRect.height <= 0) return;

  svg.setAttribute("width",  gridRect.width);
  svg.setAttribute("height", gridRect.height);
  svg.setAttribute("viewBox", `0 0 ${gridRect.width} ${gridRect.height}`);

  if (!CROSS_EDGES.length) return;

  const cards = {};
  document.querySelectorAll("#overview-grid .proc-card[data-proc]").forEach(el => {
    const r = el.getBoundingClientRect();
    cards[el.dataset.proc] = {
      x: r.left - gridRect.left,
      y: r.top  - gridRect.top,
      w: r.width, h: r.height,
    };
  });

  const defs = document.createElementNS(NS, "defs");
  const marker = document.createElementNS(NS, "marker");
  Object.entries({ id:"ov-arr", markerWidth:"8", markerHeight:"6", refX:"7", refY:"3", orient:"auto" })
    .forEach(([k, v]) => marker.setAttribute(k, v));
  const poly = document.createElementNS(NS, "polygon");
  poly.setAttribute("points", "0 0, 8 3, 0 6");
  poly.setAttribute("fill", COLOR.EDGE_CROSS);
  marker.appendChild(poly);
  defs.appendChild(marker);
  svg.appendChild(defs);

  CROSS_EDGES.forEach(e => {
    const s = cards[e.from], t = cards[e.to];
    if (!s || !t) return;
    const sCx = s.x + s.w/2, sCy = s.y + s.h/2;
    const tCx = t.x + t.w/2, tCy = t.y + t.h/2;
    const dx = tCx - sCx, dy = tCy - sCy;

    let sx, sy, tx, ty, c1x, c1y, c2x, c2y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) { sx = s.x + s.w; sy = sCy; tx = t.x;        ty = tCy; }
      else        { sx = s.x;        sy = sCy; tx = t.x + t.w; ty = tCy; }
      const off = Math.min(Math.abs(dx) / 2, 90);
      c1x = sx + Math.sign(dx) * off; c1y = sy;
      c2x = tx - Math.sign(dx) * off; c2y = ty;
    } else {
      if (dy > 0) { sx = sCx; sy = s.y + s.h; tx = tCx; ty = t.y;        }
      else        { sx = sCx; sy = s.y;        tx = tCx; ty = t.y + t.h; }
      const off = Math.min(Math.abs(dy) / 2, 90);
      c1x = sx; c1y = sy + Math.sign(dy) * off;
      c2x = tx; c2y = ty - Math.sign(dy) * off;
    }

    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", `M ${sx} ${sy} C ${c1x} ${c1y} ${c2x} ${c2y} ${tx} ${ty}`);
    path.setAttribute("stroke", COLOR.EDGE_CROSS);
    path.setAttribute("stroke-width", "1.4");
    path.setAttribute("stroke-dasharray", "5 4");
    path.setAttribute("fill", "none");
    path.setAttribute("opacity", "0.55");
    path.setAttribute("marker-end", "url(#ov-arr)");
    svg.appendChild(path);
  });
}


const procNav    = document.getElementById("proc-nav");
const overviewV  = document.getElementById("overview-view");
const flowV      = document.getElementById("flow-view");
const topTitle   = document.getElementById("topbar-title");
const topSub     = document.getElementById("topbar-sub");
const backBtn    = document.getElementById("back-btn");
const ovGrid     = document.getElementById("overview-grid");
const flowCanvas = document.getElementById("flow-canvas");
const flowArea   = document.getElementById("flow-area");
const detPanel   = document.getElementById("detail-panel");

let currentUnits = {};
let currentSvg   = null;

// ── Sidebar ───────────────────────────────────────────────
Object.entries(ALL_DATA).forEach(([name, proc]) => {
  const label = proc.displayName || name;
  const item = document.createElement("div");
  item.className = "sb-item";
  item.dataset.proc = name;
  item.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</span><span class="sb-count">${proc.stats.unit_count}</span>`;
  item.addEventListener("click", () => showProcess(name));
  procNav.appendChild(item);
});

// ── Overview cards ────────────────────────────────────────
Object.entries(ALL_DATA).forEach(([name, proc]) => {
  const s = proc.stats;
  const label = proc.displayName || name;
  const slugHtml = proc.displayName ? `<div class="proc-card-slug">${name}</div>` : "";
  const exePills = Object.entries(s.executor)
    .filter(([, n]) => n > 0)
    .map(([t, n]) => `<span class="pill pill-${t}">${t} · ${n}</span>`)
    .join("");
  const phasePills = s.phases
    .map(p => `<span class="pill pill-phase">${p}</span>`)
    .join("");
  const depsCount = CROSS_EDGES.filter(e => e.from === name || e.to === name).length;
  const card = document.createElement("div");
  card.className = "proc-card";
  card.dataset.proc = name;
  card.innerHTML = `
    <div class="proc-card-head">
      <div class="proc-card-name">${label}</div>
      <div class="proc-card-count-inline">${s.unit_count} units</div>
    </div>
    ${slugHtml}
    <div class="proc-card-mini"></div>
    <div class="proc-card-pills">${phasePills}${exePills}</div>
    <div class="proc-card-footer">
      <span>core ${s.core_count}/${s.unit_count}</span>
      ${depsCount ? `<span class="proc-card-deps">⇄ ${depsCount}</span>` : ''}
    </div>`;
  const miniBox = card.querySelector(".proc-card-mini");
  const mini = buildCardMini(proc);
  if (mini) miniBox.appendChild(mini);
  else miniBox.innerHTML = '<span class="proc-card-mini-empty">no flow</span>';
  card.addEventListener("click", () => showProcess(name));
  ovGrid.appendChild(card);
});

// ── Overview display mode toggle ───────────────────────────
ovGrid.classList.add("mode-info");
const ovToggle = document.getElementById("ov-mode-toggle");

function setOvMode(mode) {
  ovGrid.classList.toggle("mode-info", mode === "info");
  ovGrid.classList.toggle("mode-flow", mode === "flow");
  document.querySelectorAll(".ov-mode-btn")
    .forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  requestAnimationFrame(() => renderOverviewEdges());
}

document.querySelectorAll(".ov-mode-btn").forEach(b => {
  b.addEventListener("click", () => setOvMode(b.dataset.mode));
});

requestAnimationFrame(() => renderOverviewEdges());
window.addEventListener("resize", () => {
  if (overviewV.style.display !== "none") renderOverviewEdges();
});

// ── Navigation ────────────────────────────────────────────
function showOverview() {
  overviewV.style.display = "";
  flowV.style.display = "none";
  backBtn.style.display = "none";
  topTitle.textContent = "All Processes";
  topSub.textContent = "";
  ovToggle.style.display = "flex";
  document.querySelectorAll(".sb-item").forEach(el => el.classList.remove("active"));
  requestAnimationFrame(() => renderOverviewEdges());
}

function showProcess(name) {
  const proc = ALL_DATA[name];
  if (!proc) return;
  overviewV.style.display = "none";
  flowV.style.display = "flex";
  backBtn.style.display = "flex";
  topTitle.textContent = proc.displayName || name;
  topSub.textContent = proc.displayName ? `${name} · ${proc.stats.unit_count} units` : `${proc.stats.unit_count} units`;
  ovToggle.style.display = "none";
  document.querySelectorAll(".sb-item").forEach(el =>
    el.classList.toggle("active", el.dataset.proc === name));
  renderFlow(proc);

  resetFilter();
  const phases = [...new Set(Object.values(proc.units).map(u => u.phase).filter(Boolean))].sort();
  const pf = document.getElementById("idx-phase-filter");
  pf.querySelectorAll(".filter-btn:not([data-val='all'])").forEach(b => b.remove());
  if (phases.length > 1) {
    pf.style.display = "";
    phases.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "filter-btn"; btn.dataset.filter = "phase"; btn.dataset.val = p; btn.textContent = p;
      pf.appendChild(btn);
    });
  } else {
    pf.style.display = "none";
  }
  const sts = [...new Set(Object.values(proc.units).map(u => u.lifecycle_status).filter(Boolean))].sort();
  const sf = document.getElementById("idx-status-filter");
  sf.querySelectorAll(".filter-btn:not([data-val='all'])").forEach(b => b.remove());
  if (sts.length) {
    sf.style.display = "";
    sts.forEach(s => {
      const btn = document.createElement("button");
      btn.className = "filter-btn"; btn.dataset.filter = "status"; btn.dataset.val = s; btn.textContent = s;
      sf.appendChild(btn);
    });
  } else {
    sf.style.display = "none";
  }
}

// ── Heat map ─────────────────────────────────────────────
function computeHeat(unitMap) {
  const costs = Object.entries(unitMap)
    .map(([n, u]) => {
      const d = u.effort && u.effort.duration, f = u.effort && u.effort.frequency;
      return (d != null && f != null) ? {name: n, cost: d * f} : null;
    }).filter(Boolean);
  if (!costs.length) return {};
  const sorted = [...costs].sort((a, b) => a.cost - b.cost);
  const n = sorted.length;
  const heat = {};
  sorted.forEach(({name}, i) => {
    heat[name] = i < Math.ceil(n / 3) ? "low" : i < Math.ceil(2 * n / 3) ? "medium" : "high";
  });
  return heat;
}

// ── Flow rendering ────────────────────────────────────────
function renderFlow(proc) {
  const { units, positions, edges, canvasW, canvasH } = proc;
  currentUnits = units;

  flowCanvas.innerHTML = "";
  detPanel.innerHTML = '<div class="detail-empty">Select a node</div>';
  flowCanvas.style.width  = canvasW + "px";
  flowCanvas.style.height = canvasH + "px";
  flowArea.scrollTo(0, 0);

  const svg = document.createElementNS(NS, "svg");
  svg.classList.add("arrows-layer");
  svg.setAttribute("viewBox", `0 0 ${canvasW} ${canvasH}`);
  svg.style.width  = canvasW + "px";
  svg.style.height = canvasH + "px";

  const defs = document.createElementNS(NS, "defs");
  [["arr", COLOR.EDGE_SEQ], ["arr-skip", COLOR.EDGE_SKIP], ["arr-hl", COLOR.EDGE_HIGHLIGHT]].forEach(([id, color]) => {
    const m = document.createElementNS(NS, "marker");
    Object.entries({ id, markerWidth:"9", markerHeight:"7", refX:"8", refY:"3.5", orient:"auto" })
      .forEach(([k, v]) => m.setAttribute(k, v));
    const p = document.createElementNS(NS, "polygon");
    p.setAttribute("points", "0 0, 9 3.5, 0 7");
    p.setAttribute("fill", color);
    m.appendChild(p);
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  edges.forEach(([from, to, etype]) => {
    const fp = positions[from], tp = positions[to];
    if (!fp || !tp) return;
    const isParallel = etype === "parallel";
    let d;
    if (isParallel) {
      const fx = fp.left + W/2, fy = fp.top + H/2;
      const tx = tp.left + W/2, ty = tp.top + H/2;
      const my = (fy + ty) / 2;
      d = `M ${fx} ${fy} C ${fx} ${my} ${tx} ${my} ${tx} ${ty}`;
    } else {
      const fx = fp.left + W/2, fy = fp.top + H;
      const tx = tp.left + W/2, ty = tp.top;
      const sameCol = Math.abs(fx - tx) < 2;
      const isSkip  = sameCol && (ty - fy) > 100;
      if (sameCol && !isSkip) {
        d = `M ${fx} ${fy} L ${tx} ${ty-1}`;
      } else if (isSkip) {
        const ox = fp.left - 40;
        d = `M ${fx} ${fy} C ${ox} ${fy+20} ${ox} ${ty-20} ${tx} ${ty-1}`;
      } else {
        const my = (fy + ty) / 2;
        d = `M ${fx} ${fy} C ${fx} ${my} ${tx} ${my} ${tx} ${ty-1}`;
      }
    }
    const fxSeq = fp.left + W/2, fySeq = fp.top + H;
    const txSeq = tp.left + W/2, tySeq = tp.top;
    const sameColSeq = !isParallel && Math.abs(fxSeq - txSeq) < 2;
    const isSkipSeq  = sameColSeq && (tySeq - fySeq) > 100;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", isParallel ? COLOR.EDGE_PARALLEL : isSkipSeq ? COLOR.EDGE_SKIP : COLOR.EDGE_SEQ);
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("stroke-dasharray", isParallel ? "4 3" : isSkipSeq ? "5 3" : "none");
    path.setAttribute("fill", "none");
    if (!isParallel) path.setAttribute("marker-end", isSkipSeq ? "url(#arr-skip)" : "url(#arr)");
    path.dataset.from     = from;
    path.dataset.to       = to;
    path.dataset.skip     = isSkipSeq ? "true" : "false";
    path.dataset.parallel = isParallel ? "true" : "false";
    svg.appendChild(path);
  });
  currentSvg = svg;
  flowCanvas.appendChild(svg);

  const heatMap = computeHeat(units);

  const hasStatus = Object.values(units).some(u => u.lifecycle_status);
  document.getElementById("idx-status-legend").style.display = hasStatus ? "flex" : "none";

  Object.entries(positions).forEach(([name, pos]) => {
    const u = units[name];
    if (!u) return;
    const div = document.createElement("div");
    const heatClass   = heatMap[name] ? ` heat-${heatMap[name]}` : "";
    const statusClass = u.lifecycle_status ? ` status-${u.lifecycle_status}` : "";
    div.className  = `node core-${u.core}${heatClass}${statusClass}`;
    div.style.left = pos.left + "px";
    div.style.top  = pos.top  + "px";
    div.dataset.name = name;
    const costVal = (u.effort.duration != null && u.effort.frequency != null)
      ? u.effort.duration * u.effort.frequency : null;
    div.innerHTML = `
      <div class="node-name">${name}</div>
      <div class="node-badges">
        <span class="badge badge-${u.executor.type}">${u.executor.type}</span>
        ${u.core ? '<span class="badge badge-core">core</span>' : ''}
        ${costVal != null ? `<span class="badge badge-heat-${heatMap[name]}">${costVal}h/mo</span>` : ''}
      </div>`;
    div.addEventListener("click", () => {
      document.querySelectorAll(".node.selected").forEach(n => n.classList.remove("selected"));
      div.classList.add("selected");
      highlightEdges(name);
      renderDetail(name);
    });
    flowCanvas.appendChild(div);
  });
}

function highlightEdges(name) {
  if (!currentSvg) return;
  currentSvg.querySelectorAll("path[data-from]").forEach(p => {
    const skip     = p.dataset.skip === "true";
    const parallel = p.dataset.parallel === "true";
    const hit  = p.dataset.from === name || p.dataset.to === name;
    if (hit) {
      p.setAttribute("stroke", COLOR.EDGE_HIGHLIGHT);
      p.setAttribute("stroke-width", "2.5");
      p.setAttribute("stroke-dasharray", "none");
      p.setAttribute("opacity", "1");
      if (!parallel) p.setAttribute("marker-end", "url(#arr-hl)");
    } else {
      p.setAttribute("stroke", parallel ? COLOR.EDGE_PARALLEL : skip ? COLOR.EDGE_SKIP : COLOR.EDGE_SEQ);
      p.setAttribute("stroke-width", "1.5");
      p.setAttribute("stroke-dasharray", parallel ? "4 3" : skip ? "5 3" : "none");
      p.setAttribute("opacity", "0.2");
      if (!parallel) p.setAttribute("marker-end", skip ? "url(#arr-skip)" : "url(#arr)");
    }
  });
}

// ── Detail panel ──────────────────────────────────────────
function renderDetail(name) {
  const u = currentUnits[name];
  if (!u) return;
  const chips = arr =>
    arr.length
      ? arr.map(n => `<span class="link-chip" onclick="jumpTo('${n.replace(/'/g, "\'")}')">${n}</span>`).join("")
      : `<span class="link-empty">none</span>`;

  detPanel.innerHTML = `
    <div class="detail-header">
      <div class="detail-unit-name">${name}</div>
      <div class="detail-aim">${u.aim}</div>
      <div class="detail-tags">
        <span class="tag tag-phase">phase · ${u.phase}</span>
        <span class="tag tag-core-${u.core}">core · ${u.core}</span>
        <span class="tag tag-${u.executor.type}">${u.executor.type}</span>
        ${u.lifecycle_status ? `<span class="tag tag-status-${u.lifecycle_status}">${u.lifecycle_status}</span>` : ''}
      </div>
    </div>
    ${u.lifecycle_status === 'deprecated' && u.deprecated_reason ? `
    <div class="section">
      <div class="section-label">Deprecated</div>
      <div class="deprecated-banner">${u.deprecated_reason}</div>
    </div>` : ''}
    <div class="section">
      <div class="section-label">Scope</div>
      <ul class="item-list">${u.scope.map(s => `<li>${s}</li>`).join("")}</ul>
    </div>
    <div class="section">
      <div class="section-label">Rule</div>
      <ul class="item-list">${u.rule.map(r => `<li>${r}</li>`).join("")}</ul>
    </div>
    <div class="section">
      <div class="section-label">IO</div>
      <div class="io-grid">
        <div class="io-box io-box-in"><div class="io-box-label">In</div><ul>${u.io.in.map(i => `<li>${i}</li>`).join("")}</ul></div>
        <div class="io-box io-box-process"><div class="io-box-label">Process</div><ul>${u.io.process.map(p => `<li>${p}</li>`).join("")}</ul></div>
        <div class="io-box io-box-out"><div class="io-box-label">Out</div><ul>${u.io.out.map(o => `<li>${o}</li>`).join("")}</ul></div>
      </div>
    </div>
    <div class="section">
      <div class="section-label">Executor</div>
      <div class="executor-box">
        <span class="badge badge-${u.executor.type}" style="font-size:10.5px;padding:2px 8px;">${u.executor.type}</span>
        <div class="executor-reason">${u.executor.reason}</div>
      </div>
    </div>
    ${(u.effort.duration != null || u.effort.frequency != null || u.automation.difficulty || u.automation.status) ? `
    <div class="section">
      <div class="section-label">Effort / Automation</div>
      <div class="meta-grid">
        ${u.effort.duration != null ? `<div class="meta-item"><div class="meta-key">所要時間</div><div class="meta-val">${u.effort.duration}h</div></div>` : ''}
        ${u.effort.frequency != null ? `<div class="meta-item"><div class="meta-key">月間頻度</div><div class="meta-val">${u.effort.frequency}回/月</div></div>` : ''}
        ${(u.effort.duration != null && u.effort.frequency != null) ? (() => { const cost = u.effort.duration * u.effort.frequency; const diffNum = {low:1,medium:2,high:3}[u.automation.difficulty] || null; const lev = diffNum ? Math.round(cost / diffNum * 10) / 10 : null; let html = '<div class="meta-item"><div class="meta-key">月間コスト</div><div class="meta-val">' + cost + 'h/月</div></div>'; if (lev != null) { html += '<div class="meta-item"><div class="meta-key">自動化レバレッジ</div><div class="meta-val">' + lev + '</div></div>'; } return html; })() : ''}
        ${u.automation.difficulty ? `<div class="meta-item"><div class="meta-key">自動化難易度</div><div class="meta-val meta-diff-${u.automation.difficulty}">${u.automation.difficulty}</div></div>` : ''}
        ${u.automation.status ? `<div class="meta-item"><div class="meta-key">自動化状況</div><div class="meta-val">${u.automation.status}</div></div>` : ''}
      </div>
    </div>` : ''}
    <div class="section">
      <div class="section-label">Link · Up</div>
      <div class="link-chips">${chips(u.link.up)}</div>
    </div>
    <div class="section">
      <div class="section-label">Link · Down</div>
      <div class="link-chips">${chips(u.link.down)}</div>
    </div>
    ${u.depends_on && u.depends_on.length ? `
    <div class="section">
      <div class="section-label">Depends On (cross-process)</div>
      <div class="link-chips">${u.depends_on.map(d => '<span class="link-chip link-chip-ext" title="' + d + '">' + d + '</span>').join("")}</div>
    </div>` : ''}
    ${u.parallel_with && u.parallel_with.length ? `
    <div class="section">
      <div class="section-label">Parallel With</div>
      <div class="link-chips">${u.parallel_with.map(n => `<span class="link-chip" onclick="jumpTo('${n.replace(/'/g, "\'")}')">${n}</span>`).join("")}</div>
    </div>` : ''}`;
}

function jumpTo(name) {
  const el = document.querySelector(`.node[data-name="${CSS.escape(name)}"]`);
  if (!el) return;
  document.querySelectorAll(".node.selected").forEach(n => n.classList.remove("selected"));
  el.classList.add("selected");
  renderDetail(name);
  el.scrollIntoView({ behavior: "smooth", block: "center" });
}

// ── Filter ───────────────────────────────────────────────
const filterState = { core: "all", executor: "all", phase: "all", status: "all", search: "" };

function applyFilter() {
  const q = filterState.search.toLowerCase();
  document.querySelectorAll("#flow-canvas .node[data-name]").forEach(el => {
    const name = el.dataset.name;
    const u = currentUnits[name];
    if (!u) return;
    const match =
      (filterState.core     === "all" || String(u.core) === filterState.core) &&
      (filterState.executor === "all" || u.executor.type === filterState.executor) &&
      (filterState.phase    === "all" || u.phase === filterState.phase) &&
      (filterState.status   === "all" || (u.lifecycle_status || "") === filterState.status) &&
      (!q || name.toLowerCase().includes(q) || u.aim.toLowerCase().includes(q));
    el.style.opacity       = match ? "1" : "0.1";
    el.style.pointerEvents = match ? "" : "none";
  });
}

document.getElementById("flow-filter-bar").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  const f = btn.dataset.filter, v = btn.dataset.val;
  filterState[f] = v;
  document.querySelectorAll(`#flow-filter-bar .filter-btn[data-filter="${f}"]`).forEach(b => b.classList.toggle("active", b === btn));
  applyFilter();
});
document.getElementById("idx-filter-search").addEventListener("input", e => {
  filterState.search = e.target.value;
  applyFilter();
});

function resetFilter() {
  Object.keys(filterState).forEach(k => { filterState[k] = k === "search" ? "" : "all"; });
  document.querySelectorAll("#flow-filter-bar .filter-btn").forEach(b => b.classList.toggle("active", b.dataset.val === "all"));
  document.getElementById("idx-filter-search").value = "";
}

</script>
