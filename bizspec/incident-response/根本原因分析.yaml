unit: 根本原因分析
aim: インシデントの根本原因を特定し、再発防止策の方向性を決定する
phase: ops
scope:
  - 直接原因と根本原因の特定と区別
  - 再発防止策の方向性（技術・プロセス・組織）の整理
rule:
  - 個人の責任を問わず、システム・プロセスの問題として捉える
  - 「〇〇がミスをした」ではなく「〇〇が起きやすい状況があった」という視点で分析する
link:
  up:
    - 一次対応
  down:
    - 恒久対策実装
core: true
io:
  in:
    - 一次対応完了報告
    - インシデントログ・ログ・トレース
  process:
    - 5 Why で根本原因を特定
    - 直接原因・根本原因・再発防止策を整理
  out:
    - 根本原因分析結果
executor:
  type: ai_agent
  reason: ログと事象から因果関係を推論し、根本原因を体系的に整理する分析が必要なため
effort:
  duration: 2
  frequency: 1
automation:
  difficulty: high
  status: manual
status: stable
