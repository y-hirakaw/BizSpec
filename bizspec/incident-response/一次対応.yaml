unit: 一次対応
aim: サービス影響を最小化するための緊急措置を実施する
phase: ops
job:
  - 切り戻し・機能フラグ無効化・トラフィック遮断など影響を止める手段を選択する
  - 緊急措置を実施してサービスへの影響が収まったことを確認する
  - 措置内容と時刻をインシデントログに記録する
rule:
  - 原因特定より先に影響を止めることを優先する
  - 切り戻しが最速・最安全な場合はためらわず実施する
  - すべての操作を時刻付きでログに残す
link:
  up:
    - 影響範囲調査
  down:
    - 根本原因分析
core: true
io:
  in:
    - 影響範囲レポート
  run:
    - 緊急措置の選択・実施
    - 影響収束を確認・記録
  out:
    - 一次対応完了報告（措置内容・収束時刻）
executor:
  type: manual
  reason: 緊急措置の選択と実行はオンコール担当者の状況判断が必要なため
effort:
  duration: 1
  frequency: 1
automation:
  difficulty: high
  status: manual
status: stable
