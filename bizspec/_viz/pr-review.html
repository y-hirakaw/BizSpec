<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRレビュー — BizSpec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:              #F2EEE5;
  --bg-elevated:     #FBF8F1;
  --bg-card:         #FFFFFF;
  --bg-card-hover:   #FBF8F1;
  --bg-input:        #FBF8F1;
  --bg-overlay:      rgba(31, 26, 18, 0.03);

  --border:          #E5DFD0;
  --border-strong:   #D4CDB9;

  --text-primary:    #1F1A12;
  --text-secondary:  #6B6253;
  --text-muted:      #A09783;
  --text-inverse:    #FBF8F1;

  --accent:          #C2410C;
  --accent-dim:      #9A340A;
  --accent-soft:     rgba(194, 65, 12, 0.08);
  --accent-glow:     rgba(194, 65, 12, 0.18);

  --status-draft-bg:        #FBF4DC;
  --status-draft-border:    #B59308;
  --status-draft-fg:        #6E5403;
  --status-review-bg:       #FBE9D6;
  --status-review-border:   #C2410C;
  --status-review-fg:       #7A2C0A;
  --status-stable-bg:       #ECF1E0;
  --status-stable-border:   #5F8C40;
  --status-stable-fg:       #2F4D1B;
  --status-deprecated-bg:   #ECE6D8;
  --status-deprecated-border:#C7BFAE;
  --status-deprecated-fg:   #8B8270;

  --heat-low-bg:        #FBF6DA;
  --heat-low-border:    #DBA91F;
  --heat-low-fg:        #7A5A04;
  --heat-medium-bg:     #FBE5C8;
  --heat-medium-border: #D27319;
  --heat-medium-fg:     #92420C;
  --heat-high-bg:       #FBDDD2;
  --heat-high-border:   #B5482E;
  --heat-high-fg:       #7A1F08;

  --exec-script-bg:    rgba(30, 64, 175, 0.07);
  --exec-script-fg:    #1E40AF;
  --exec-script-border:rgba(30, 64, 175, 0.22);
  --exec-ai_agent-bg:    rgba(109, 40, 217, 0.07);
  --exec-ai_agent-fg:    #5B21B6;
  --exec-ai_agent-border:rgba(109, 40, 217, 0.22);
  --exec-manual-bg:    rgba(87, 83, 78, 0.07);
  --exec-manual-fg:    #57534E;
  --exec-manual-border:rgba(87, 83, 78, 0.20);

  --edge-seq:         #B0A892;
  --edge-skip:        #C2410C;
  --edge-parallel:    #5F8C40;
  --edge-highlight:   #C2410C;

  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:    'IBM Plex Sans', -apple-system, BlinkMacSystemFont,
                  'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13.5px;
  line-height: 1.55;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "ss02";
}
body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1000;
  opacity: 0.05;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
}

::selection { background: var(--accent); color: var(--text-inverse); }

/* ── Header ─────────────────────────────────────────────── */
header {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 18px 28px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: relative;
}
header::after {
  content: "BIZSPEC / PROCESS";
  position: absolute;
  top: 6px; right: 28px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--text-muted);
}
header h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 28px;
  letter-spacing: -0.018em;
  color: var(--text-primary);
  line-height: 1;
}
header .subtitle {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

/* ── Legend ─────────────────────────────────────────────── */
.legend-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 8px 28px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.lswatch {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  border: 1px solid var(--border-strong);
}
.lpill {
  height: 16px;
  padding: 0 7px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  border: 1px solid transparent;
}

/* ── Filter bar ─────────────────────────────────────────── */
.filter-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 28px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 6px; }
.filter-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  margin-right: 4px;
}
.filter-btn {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 10px;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-secondary);
  transition: color .15s var(--ease), border-color .15s var(--ease), background .15s var(--ease);
  line-height: 1.5;
  letter-spacing: 0.05em;
}
.filter-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
.filter-btn.active {
  background: var(--accent);
  color: var(--text-inverse);
  border-color: var(--accent);
}
.filter-search {
  font-family: var(--font-mono);
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-primary);
  outline: none;
  width: 160px;
  letter-spacing: 0.04em;
}
.filter-search:focus { border-color: var(--accent); }
.filter-search::placeholder { color: var(--text-muted); }

/* ── Layout ─────────────────────────────────────────────── */
.layout {
  flex: 1 1 0;
  display: flex;
  min-height: 0;
}
.flow-area {
  flex: 0 0 auto;
  min-width: 360px;
  max-width: 60vw;
  overflow: auto;
  background: var(--bg);
  border-right: 1px solid var(--border);
  padding: 32px 28px 60px;
  background-image:
    linear-gradient(var(--bg-overlay) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-overlay) 1px, transparent 1px);
  background-size: 40px 40px;
}
.flow-canvas { position: relative; }
svg.arrows-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}

/* ── Node ───────────────────────────────────────────────── */
.node {
  position: absolute;
  width: 200px;
  height: 54px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  padding: 8px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  transition: border-color .15s var(--ease), background .15s var(--ease);
  user-select: none;
  font-family: var(--font-body);
}
.node:hover { border-color: var(--accent); background: var(--bg-card-hover); }
.node.selected {
  border-color: var(--accent);
  background: var(--bg-card-hover);
  box-shadow: 0 0 0 1px var(--accent), 0 0 24px -4px var(--accent-glow);
  z-index: 5;
}
.node.core-true  { border-left-width: 3px; border-left-color: var(--accent); }
.node.core-false { border-left-width: 3px; border-left-color: var(--text-muted); }

.node.heat-low    { background: var(--heat-low-bg)    !important; border-color: var(--heat-low-border)    !important; }
.node.heat-medium { background: var(--heat-medium-bg) !important; border-color: var(--heat-medium-border) !important; }
.node.heat-high   { background: var(--heat-high-bg)   !important; border-color: var(--heat-high-border)   !important; }

.node.status-draft      { background: var(--status-draft-bg)      !important; border-color: var(--status-draft-border)      !important; }
.node.status-review     { background: var(--status-review-bg)     !important; border-color: var(--status-review-border)     !important; }
.node.status-stable     { background: var(--status-stable-bg)     !important; border-color: var(--status-stable-border)     !important; }
.node.status-deprecated {
  background: var(--status-deprecated-bg) !important;
  border-color: var(--status-deprecated-border) !important;
  opacity: 0.55;
}
.node.status-deprecated .node-name { text-decoration: line-through; }

.node-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.3;
  letter-spacing: -0.005em;
}
.node-badges { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  padding: 1px 5px;
  white-space: nowrap;
  line-height: 1.5;
  letter-spacing: 0.04em;
  border: 1px solid transparent;
}
.badge-script   { background: var(--exec-script-bg);   color: var(--exec-script-fg);   border-color: var(--exec-script-border); }
.badge-ai_agent { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); border-color: var(--exec-ai_agent-border); }
.badge-manual   { background: var(--exec-manual-bg);   color: var(--exec-manual-fg);   border-color: var(--exec-manual-border); }
.badge-core     { background: var(--accent-soft);      color: var(--accent);           border-color: var(--accent); }
.badge-heat-low    { background: transparent; color: var(--heat-low-fg);    border-color: var(--heat-low-border); }
.badge-heat-medium { background: transparent; color: var(--heat-medium-fg); border-color: var(--heat-medium-border); }
.badge-heat-high   { background: transparent; color: var(--heat-high-fg);   border-color: var(--heat-high-border); }

/* ── Detail panel ──────────────────────────────────────── */
.detail-panel {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 32px 36px 60px;
  background: var(--bg-elevated);
  min-width: 0;
}
.detail-empty {
  height: 100%;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.detail-header {
  padding-bottom: 20px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
}
.detail-unit-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: -0.018em;
  color: var(--text-primary);
  margin-bottom: 10px;
  word-break: break-all;
}
.detail-aim {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 14px;
}
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  padding: 2px 9px;
  border: 1px solid transparent;
  letter-spacing: 0.04em;
}
.tag-phase      { background: transparent; color: var(--text-secondary); border-color: var(--border-strong); }
.tag-core-true  { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tag-core-false { background: transparent; color: var(--text-muted); border-color: var(--border-strong); }
.tag-script     { background: var(--exec-script-bg);   color: var(--exec-script-fg);   border-color: var(--exec-script-border); }
.tag-ai_agent   { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); border-color: var(--exec-ai_agent-border); }
.tag-manual     { background: var(--exec-manual-bg);   color: var(--exec-manual-fg);   border-color: var(--exec-manual-border); }
.tag-status-draft      { background: transparent; color: var(--status-draft-fg);      border-color: var(--status-draft-border); }
.tag-status-review     { background: transparent; color: var(--status-review-fg);     border-color: var(--status-review-border); }
.tag-status-stable     { background: transparent; color: var(--status-stable-fg);     border-color: var(--status-stable-border); }
.tag-status-deprecated { background: transparent; color: var(--status-deprecated-fg); border-color: var(--status-deprecated-border); }

.section { margin-bottom: 26px; }
.section-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::before {
  content: "";
  display: inline-block;
  width: 14px;
  height: 1px;
  background: var(--accent);
}
.item-list {
  list-style: none;
  padding: 0;
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.75;
}
.item-list li {
  padding-left: 18px;
  position: relative;
}
.item-list li::before {
  content: "→";
  position: absolute;
  left: 0;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  top: 5px;
}
.io-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.io-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 12px 14px;
}
.io-box-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin-bottom: 8px;
  color: var(--text-muted);
}
.io-box-in      .io-box-label { color: var(--exec-script-fg); }
.io-box-process .io-box-label { color: var(--exec-ai_agent-fg); }
.io-box-out     .io-box-label { color: var(--status-stable-fg); }
.io-box ul {
  list-style: none;
  padding: 0;
  font-size: 11.5px;
  color: var(--text-secondary);
  line-height: 1.65;
}
.io-box ul li { padding-left: 11px; position: relative; }
.io-box ul li::before { content: "·"; position: absolute; left: 0; color: var(--text-muted); }

.executor-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 14px;
}
.executor-reason {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-top: 8px;
  line-height: 1.65;
}

.deprecated-banner {
  font-size: 12.5px;
  color: var(--status-deprecated-fg);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--status-review-border);
  padding: 10px 14px;
  line-height: 1.6;
}

.link-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 10px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  cursor: pointer;
  transition: background .15s var(--ease), color .15s var(--ease);
  letter-spacing: 0.02em;
}
.link-chip:hover { background: var(--accent); color: var(--text-inverse); }
.link-chip-ext {
  background: transparent;
  color: var(--exec-ai_agent-fg);
  border-color: var(--exec-ai_agent-border);
  cursor: default;
}
.link-chip-ext:hover { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); }
.link-empty {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

.meta-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.meta-item {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 14px;
  min-width: 130px;
}
.meta-key {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.meta-val {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 0.01em;
}
.meta-diff-low    { color: var(--status-stable-fg); }
.meta-diff-medium { color: var(--status-review-fg); }
.meta-diff-high   { color: var(--heat-high-fg); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-strong); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<header>
  <h1>PRレビュー</h1>
  <span class="subtitle">pr-review &nbsp;·&nbsp; 4 units &nbsp;·&nbsp; phase: dev</span>
</header>

<div class="legend-bar">
  <div class="legend-item">
    <div class="lswatch" style="background:#FFFFFF;border-left:3px solid #C2410C;"></div>
    core: true
  </div>
  <div class="legend-item">
    <div class="lswatch" style="background:#FBF8F1;border-left:3px solid #A09783;"></div>
    core: false
  </div>
  <div class="legend-item">
    <div class="lpill" style="background:rgba(30, 64, 175, 0.07);color:#1E40AF;border-color:rgba(30, 64, 175, 0.22);">script</div>
  </div>
  <div class="legend-item">
    <div class="lpill" style="background:rgba(109, 40, 217, 0.07);color:#5B21B6;border-color:rgba(109, 40, 217, 0.22);">ai_agent</div>
  </div>
  <div class="legend-item">
    <div class="lpill" style="background:rgba(87, 83, 78, 0.07);color:#57534E;border-color:rgba(87, 83, 78, 0.20);">manual</div>
  </div>
  <div class="legend-item" id="heat-legend" style="display:none;gap:5px;">
    <span style="font-size:9.5px;color:var(--text-muted);letter-spacing:0.12em;">HEAT:</span>
    <div class="lswatch" style="background:#FBF6DA;border-color:#DBA91F;" title="低コスト"></div>
    <div class="lswatch" style="background:#FBE5C8;border-color:#D27319;" title="中コスト"></div>
    <div class="lswatch" style="background:#FBDDD2;border-color:#B5482E;" title="高コスト"></div>
  </div>
  <div class="legend-item" id="status-legend" style="display:none;gap:5px;">
    <span style="font-size:9.5px;color:var(--text-muted);letter-spacing:0.12em;">STATUS:</span>
    <div class="lswatch" style="background:#FBF4DC;border-color:#B59308;" title="draft"></div>
    <div class="lswatch" style="background:#FBE9D6;border-color:#C2410C;" title="review"></div>
    <div class="lswatch" style="background:#ECF1E0;border-color:#5F8C40;" title="stable"></div>
    <div class="lswatch" style="background:#ECE6D8;border-color:#C7BFAE;" title="deprecated"></div>
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <div class="filter-group">
    <span class="filter-label">Core</span>
    <button class="filter-btn active" data-filter="core" data-val="all">all</button>
    <button class="filter-btn" data-filter="core" data-val="true">true</button>
    <button class="filter-btn" data-filter="core" data-val="false">false</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">Executor</span>
    <button class="filter-btn active" data-filter="executor" data-val="all">all</button>
    <button class="filter-btn" data-filter="executor" data-val="script">script</button>
    <button class="filter-btn" data-filter="executor" data-val="ai_agent">ai_agent</button>
    <button class="filter-btn" data-filter="executor" data-val="manual">manual</button>
  </div>
  <div class="filter-group" id="phase-filter-group" style="display:none;">
    <span class="filter-label">Phase</span>
    <button class="filter-btn active" data-filter="phase" data-val="all">all</button>
  </div>
  <div class="filter-group" id="status-filter-group" style="display:none;">
    <span class="filter-label">Status</span>
    <button class="filter-btn active" data-filter="status" data-val="all">all</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">Search</span>

<script>
const units     = {
  "テストレビュー": {
    "aim": "テストコードの網羅性と品質を評価する",
    "phase": "dev",
    "core": true,
    "scope": [
      "テストの網羅性（正常系・異常系・境界値）の評価",
      "壊れやすい実装パターン（モック過多・実装依存）の検出"
    ],
    "rule": [

    "io": {
      "in": [
        "変更ファイル一覧",
        "差分テキスト"
      ],
      "process": [

      ],
      "out": [

    },
    "executor": {

    "link": {

      ],

      ]
    },
    "depends_on": [],
    "effort": {

    },

    ]
  },
  "ロジックレビュー": {

    "phase": "dev",
    "core": true,
    "scope": [

    "io": {

      ]
    },
    "executor": {

      "reason": "コードの意図理解と設計判断に自然言語推論が必要なため"
    },
    "link": {
      "up": [
        "差分取得"
      ],
      "down": [
        "承認判定"
      ]
    },
    "depends_on": [],
    "effort": {
      "duration": 2,
      "frequency": 40
    },
    "automation": {
      "difficulty": "medium",
      "status": "partially-automated"
    },
    "lifecycle_status": null,
    "deprecated_reason": null,
    "parallel_with": []
  },
  "差分取得": {

    "phase": "dev",
    "core": true,

    "io": {

      ],

      ],
      "out": [
        "変更ファイル一覧（ファイルパス・追加行数・削除行数）",
        "差分テキスト"
      ]
    },
    "executor": {
      "type": "script",
      "reason": "GitHub API の定型呼び出しで完結するため"
    },
    "link": {
      "up": [],
      "down": [
        "ロジックレビュー",
        "テストレビュー"
      ]
    },
    "depends_on": [
      "issue-refinement:Ready判定",
      "implementation:PR作成"
    ],
    "effort": {
      "duration": 0.5,
      "frequency": 40
    },
    "automation": {
      "difficulty": "low",
      "status": "automated"
    },
    "lifecycle_status": null,
    "deprecated_reason": null,
    "parallel_with": []
  },
  "承認判定": {
    "aim": "レビュー結果を総合してマージ可否を判定する",
    "phase": "dev",
    "core": true,
    "scope": [
      "レビュー結果の集約と Approve / Request Changes の判定",
      "GitHub PR への判定・サマリー・コメントの投稿"
    ],
    "rule": [
      "ブロック指摘が 1 件でもあれば Request Changes にする",
      "nit のみであれば Approve してコメントを残す",
      "指摘件数・ブロック有無・判定結果をサマリーに含める"
    ],
    "io": {
      "in": [
        "ロジックレビューコメント一覧",
        "テストレビューコメント一覧"
      ],
      "process": [
        "ブロック指摘を抽出する",
        "Approve / Request Changes を決定する",
        "GitHub API (POST /pulls/{number}/reviews) でレビューを投稿する"
      ],
      "out": [
        "PRへの投稿済みレビュー（判定・サマリー・コメント一覧）"
      ]
    },
    "executor": {
      "type": "ai_agent",
      "reason": "複数レビュー結果の統合判断と自然言語サマリー生成が必要なため"
    },
    "link": {
      "up": [
        "ロジックレビュー",
        "テストレビュー"
      ],
      "down": []
    },
    "depends_on": [],
    "effort": {
      "duration": 0.5,
      "frequency": 40
    },
    "automation": {
      "difficulty": "medium",
      "status": "manual"
    },
    "lifecycle_status": null,
    "deprecated_reason": null,
    "parallel_with": []
  }
};
const positions = {"差分取得": {"left": 110, "top": 24}, "テストレビュー": {"left": 0, "top": 134}, "ロジックレビュー": {"left": 220, "top": 134}, "承認判定": {"left": 110, "top": 244}};
const edges     = [["テストレビュー", "承認判定", "seq"], ["テストレビュー", "ロジックレビュー", "parallel"], ["ロジックレビュー", "承認判定", "seq"], ["差分取得", "ロジックレビュー", "seq"], ["差分取得", "テストレビュー", "seq"]];

const W = 200, H = 54;
const canvas     = document.getElementById("canvas");
const detailPane = document.getElementById("detail-panel");

const COLOR = {
  EDGE_SEQ:        "#B0A892",
  EDGE_SKIP:       "#C2410C",
  EDGE_PARALLEL:   "#5F8C40",
  EDGE_HIGHLIGHT:  "#C2410C",
};

// ── SVG arrows ──────────────────────────────────────────
const NS  = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(NS, "svg");
svg.classList.add("arrows-layer");
svg.setAttribute("viewBox", "0 0 420 322");

const defs = document.createElementNS(NS, "defs");
[["arrowhead", COLOR.EDGE_SEQ], ["arrowhead-skip", COLOR.EDGE_SKIP], ["arrowhead-hl", COLOR.EDGE_HIGHLIGHT]].forEach(([id, color]) => {
  const m = document.createElementNS(NS, "marker");
  Object.entries({ id, markerWidth:"9", markerHeight:"7", refX:"8", refY:"3.5", orient:"auto" })
    .forEach(([k, v]) => m.setAttribute(k, v));
  const p = document.createElementNS(NS, "polygon");
  p.setAttribute("points", "0 0, 9 3.5, 0 7");
  p.setAttribute("fill", color);
  m.appendChild(p);
  defs.appendChild(m);
});
svg.appendChild(defs);

edges.forEach(([from, to, etype]) => {
  const fp = positions[from], tp = positions[to];
  if (!fp || !tp) return;
  const isParallel = etype === "parallel";
  const fx = fp.left + W / 2, fy = fp.top + H / 2;
  const tx = tp.left + W / 2, ty = tp.top + H / 2;
  const fxb = fp.left + W / 2, fyb = fp.top + H;
  const txb = tp.left + W / 2, tyb = tp.top;
  const path = document.createElementNS(NS, "path");
  let d;
  if (isParallel) {
    const my = (fy + ty) / 2;
    d = `M ${fx} ${fy} C ${fx} ${my} ${tx} ${my} ${tx} ${ty}`;
  } else {
    const sameCol = Math.abs(fxb - txb) < 2;
    const isSkip  = sameCol && (tyb - fyb) > 100;
    if (sameCol && !isSkip) {
      d = `M ${fxb} ${fyb} L ${txb} ${tyb - 1}`;
    } else if (isSkip) {
      const ox = fp.left - 40;
      d = `M ${fxb} ${fyb} C ${ox} ${fyb + 20} ${ox} ${tyb - 20} ${txb} ${tyb - 1}`;
    } else {
      const my = (fyb + tyb) / 2;
      d = `M ${fxb} ${fyb} C ${fxb} ${my} ${txb} ${my} ${txb} ${tyb - 1}`;
    }
  }
  const sameColSeq = !isParallel && Math.abs(fxb - txb) < 2;
  const isSkipSeq  = sameColSeq && (tp.top - fp.top - H) > 100;
  path.setAttribute("d", d);
  path.setAttribute("stroke", isParallel ? COLOR.EDGE_PARALLEL : isSkipSeq ? COLOR.EDGE_SKIP : COLOR.EDGE_SEQ);
  path.setAttribute("stroke-width", "1.5");
  path.setAttribute("stroke-dasharray", isParallel ? "4 3" : isSkipSeq ? "5 3" : "none");
  path.setAttribute("fill", "none");
  if (!isParallel) path.setAttribute("marker-end", isSkipSeq ? "url(#arrowhead-skip)" : "url(#arrowhead)");
  path.dataset.from = from;
  path.dataset.to   = to;
  path.dataset.skip     = isSkipSeq ? "true" : "false";
  path.dataset.parallel = isParallel ? "true" : "false";
  svg.appendChild(path);
});

canvas.appendChild(svg);

function highlightEdges(name) {
  svg.querySelectorAll("path[data-from]").forEach(p => {
    const skip     = p.dataset.skip === "true";
    const parallel = p.dataset.parallel === "true";
    const hit  = p.dataset.from === name || p.dataset.to === name;
    if (hit) {
      p.setAttribute("stroke", COLOR.EDGE_HIGHLIGHT);
      p.setAttribute("stroke-width", "2.5");
      p.setAttribute("stroke-dasharray", "none");
      p.setAttribute("opacity", "1");
      p.setAttribute("marker-end", "url(#arrowhead-hl)");
    } else {
      p.setAttribute("stroke", parallel ? COLOR.EDGE_PARALLEL : skip ? COLOR.EDGE_SKIP : COLOR.EDGE_SEQ);
      p.setAttribute("stroke-width", "1.5");
      p.setAttribute("stroke-dasharray", parallel ? "4 3" : skip ? "5 3" : "none");
      p.setAttribute("opacity", "0.2");
      if (!parallel) p.setAttribute("marker-end", skip ? "url(#arrowhead-skip)" : "url(#arrowhead)");
    }
  });
}

// ── Heat map ──────────────────────────────────────────────
function computeHeat(unitMap) {
  const costs = Object.entries(unitMap)
    .map(([n, u]) => {
      const d = u.effort && u.effort.duration, f = u.effort && u.effort.frequency;
      return (d != null && f != null) ? {name: n, cost: d * f} : null;
    }).filter(Boolean);
  if (!costs.length) return {};
  const sorted = [...costs].sort((a, b) => a.cost - b.cost);
  const n = sorted.length;
  const heat = {};
  sorted.forEach(({name, cost}, i) => {
    heat[name] = i < Math.ceil(n / 3) ? "low" : i < Math.ceil(2 * n / 3) ? "medium" : "high";
  });
  return heat;
}
const heatMap = computeHeat(units);
if (Object.keys(heatMap).length) document.getElementById("heat-legend").style.display = "flex";
if (Object.values(units).some(u => u.lifecycle_status)) document.getElementById("status-legend").style.display = "flex";

// ── Nodes ────────────────────────────────────────────────
Object.entries(positions).forEach(([name, pos]) => {
  const u   = units[name];
  if (!u) return;
  const div = document.createElement("div");
  const heatClass   = heatMap[name] ? ` heat-${heatMap[name]}` : "";
  const statusClass = u.lifecycle_status ? ` status-${u.lifecycle_status}` : "";
  div.className    = `node core-${u.core}${heatClass}${statusClass}`;
  div.style.left   = pos.left + "px";
  div.style.top    = pos.top  + "px";
  div.dataset.name = name;

  const costVal = (u.effort.duration != null && u.effort.frequency != null)
    ? u.effort.duration * u.effort.frequency : null;
  div.innerHTML = `
    <div class="node-name">${name}</div>
    <div class="node-badges">
      <span class="badge badge-${u.executor.type}">${u.executor.type}</span>
      ${u.core ? '<span class="badge badge-core">core</span>' : ''}
      ${costVal != null ? `<span class="badge badge-heat-${heatMap[name]}">${costVal}h/mo</span>` : ''}
    </div>`;

  div.addEventListener("click", () => {
    document.querySelectorAll(".node.selected").forEach(n => n.classList.remove("selected"));
    div.classList.add("selected");
    highlightEdges(name);
    renderDetail(name);
  });

  canvas.appendChild(div);
});

// ── Detail panel ─────────────────────────────────────────
function renderDetail(name) {
  const u = units[name];
  const chips = (arr) =>
    arr.length
      ? arr.map(n => `<span class="link-chip" onclick="jumpTo('${n.replace(/'/g, "\'")}')">${n}</span>`).join("")
      : `<span class="link-empty">none</span>`;

  detailPane.innerHTML = `
    <div class="detail-header">
      <div class="detail-unit-name">${name}</div>
      <div class="detail-aim">${u.aim}</div>
      <div class="detail-tags">
        <span class="tag tag-phase">phase · ${u.phase}</span>
        <span class="tag tag-core-${u.core}">core · ${u.core}</span>
        <span class="tag tag-${u.executor.type}">${u.executor.type}</span>
        ${u.lifecycle_status ? `<span class="tag tag-status-${u.lifecycle_status}">${u.lifecycle_status}</span>` : ''}
      </div>
    </div>

    ${u.lifecycle_status === 'deprecated' && u.deprecated_reason ? `
    <div class="section">
      <div class="section-label">Deprecated</div>
      <div class="deprecated-banner">${u.deprecated_reason}</div>
    </div>` : ''}

    <div class="section">
      <div class="section-label">Scope</div>
      <ul class="item-list">${u.scope.map(s => `<li>${s}</li>`).join("")}</ul>
    </div>

    <div class="section">
      <div class="section-label">Rule</div>
      <ul class="item-list">${u.rule.map(r => `<li>${r}</li>`).join("")}</ul>
    </div>

    <div class="section">
      <div class="section-label">IO</div>
      <div class="io-grid">
        <div class="io-box io-box-in">
          <div class="io-box-label">In</div>
          <ul>${u.io.in.map(i => `<li>${i}</li>`).join("")}</ul>
        </div>
        <div class="io-box io-box-process">
          <div class="io-box-label">Process</div>
          <ul>${u.io.process.map(p => `<li>${p}</li>`).join("")}</ul>
        </div>
        <div class="io-box io-box-out">
          <div class="io-box-label">Out</div>
          <ul>${u.io.out.map(o => `<li>${o}</li>`).join("")}</ul>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Executor</div>
      <div class="executor-box">
        <span class="badge badge-${u.executor.type}" style="font-size:10.5px;padding:2px 8px;">${u.executor.type}</span>
        <div class="executor-reason">${u.executor.reason}</div>
      </div>
    </div>

    ${(u.effort.duration != null || u.effort.frequency != null || u.automation.difficulty || u.automation.status) ? `
    <div class="section">
      <div class="section-label">Effort / Automation</div>
      <div class="meta-grid">
        ${u.effort.duration != null ? `<div class="meta-item"><div class="meta-key">所要時間</div><div class="meta-val">${u.effort.duration}h</div></div>` : ''}
        ${u.effort.frequency != null ? `<div class="meta-item"><div class="meta-key">月間頻度</div><div class="meta-val">${u.effort.frequency}回/月</div></div>` : ''}
        ${(u.effort.duration != null && u.effort.frequency != null) ? (() => { const cost = u.effort.duration * u.effort.frequency; const diffNum = {low:1,medium:2,high:3}[u.automation.difficulty] || null; const lev = diffNum ? Math.round(cost / diffNum * 10) / 10 : null; let html = '<div class="meta-item"><div class="meta-key">月間コスト</div><div class="meta-val">' + cost + 'h/月</div></div>'; if (lev != null) { html += '<div class="meta-item"><div class="meta-key">自動化レバレッジ</div><div class="meta-val">' + lev + '</div></div>'; } return html; })() : ''}
        ${u.automation.difficulty ? `<div class="meta-item"><div class="meta-key">自動化難易度</div><div class="meta-val meta-diff-${u.automation.difficulty}">${u.automation.difficulty}</div></div>` : ''}
        ${u.automation.status ? `<div class="meta-item"><div class="meta-key">自動化状況</div><div class="meta-val">${u.automation.status}</div></div>` : ''}
      </div>
    </div>` : ''}

    <div class="section">
      <div class="section-label">Link · Up</div>
      <div class="link-chips">${chips(u.link.up)}</div>
    </div>
    <div class="section">
      <div class="section-label">Link · Down</div>
      <div class="link-chips">${chips(u.link.down)}</div>
    </div>
    ${u.depends_on && u.depends_on.length ? `
    <div class="section">
      <div class="section-label">Depends On (cross-process)</div>
      <div class="link-chips">${u.depends_on.map(d => '<span class="link-chip link-chip-ext" title="' + d + '">' + d + '</span>').join("")}</div>
    </div>` : ''}`;
}

function jumpTo(name) {
  const el = document.querySelector(`.node[data-name="${CSS.escape(name)}"]`);
  if (!el) return;
  document.querySelectorAll(".node.selected").forEach(n => n.classList.remove("selected"));
  el.classList.add("selected");
  renderDetail(name);
  el.scrollIntoView({ behavior: "smooth", block: "center" });
}

// ── Filter ───────────────────────────────────────────────
const filterState = { core: "all", executor: "all", phase: "all", status: "all", search: "" };

function applyFilter() {
  const q = filterState.search.toLowerCase();
  document.querySelectorAll(".node[data-name]").forEach(el => {
    const name = el.dataset.name;
    const u = units[name];
    if (!u) return;
    const match =
      (filterState.core     === "all" || String(u.core) === filterState.core) &&
      (filterState.executor === "all" || u.executor.type === filterState.executor) &&
      (filterState.phase    === "all" || u.phase === filterState.phase) &&
      (filterState.status   === "all" || (u.lifecycle_status || "") === filterState.status) &&
      (!q || name.toLowerCase().includes(q) || u.aim.toLowerCase().includes(q));
    el.style.opacity       = match ? "1" : "0.1";
    el.style.pointerEvents = match ? "" : "none";
  });
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const f = btn.dataset.filter, v = btn.dataset.val;
    filterState[f] = v;
    document.querySelectorAll(`.filter-btn[data-filter="${f}"]`).forEach(b => b.classList.toggle("active", b === btn));
    applyFilter();
  });
});
document.getElementById("filter-search").addEventListener("input", e => {
  filterState.search = e.target.value;
  applyFilter();
});

// Populate phase filter
const phases = [...new Set(Object.values(units).map(u => u.phase).filter(Boolean))].sort();
if (phases.length > 1) {
  const pg = document.getElementById("phase-filter-group");
  pg.style.display = "";
  phases.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "filter-btn"; btn.dataset.filter = "phase"; btn.dataset.val = p; btn.textContent = p;
    pg.appendChild(btn);
  });
}

// Populate status filter
const statuses = [...new Set(Object.values(units).map(u => u.lifecycle_status).filter(Boolean))].sort();
if (statuses.length) {
  const sg = document.getElementById("status-filter-group");
  sg.style.display = "";
  statuses.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "filter-btn"; btn.dataset.filter = "status"; btn.dataset.val = s; btn.textContent = s;
    sg.appendChild(btn);
  });
}
</script>
