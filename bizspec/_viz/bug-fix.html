<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bug-fix — BizSpec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Engineering Console — Design Tokens ───────────────── */
:root, [data-theme="light"] {
  --bg:              #FCFCFC;
  --bg-elevated:     #FFFFFF;
  --bg-card:         #FFFFFF;
  --bg-card-hover:   #F7F7F7;
  --bg-input:        #FAFAFA;
  --bg-overlay:      rgba(14, 14, 14, 0.025);
  --bg-subtle:       #F7F7F7;
  --bg-inset:        #FAFAFA;
  --border:          #E5E5E5;
  --border-strong:   #D4D4D4;
  --border-soft:     #F0F0F0;
  --text-primary:    #0E0E0E;
  --text-secondary:  #525252;
  --text-muted:      #A3A3A3;
  --text-inverse:    #FFFFFF;
  --accent:          #2563EB;
  --accent-dim:      #1D4ED8;
  --accent-soft:     #EEF2FF;
  --accent-glow:     rgba(37, 99, 235, 0.15);
  --status-draft-bg:        rgba(217, 119, 6, 0.06);
  --status-draft-border:    #D97706;
  --status-draft-fg:        #B45309;
  --status-review-bg:       rgba(37, 99, 235, 0.06);
  --status-review-border:   #2563EB;
  --status-review-fg:       #1E40AF;
  --status-stable-bg:       rgba(16, 185, 129, 0.06);
  --status-stable-border:   #10B981;
  --status-stable-fg:       #047857;
  --status-deprecated-bg:   #F4F4F5;
  --status-deprecated-border:#D4D4D4;
  --status-deprecated-fg:   #71717A;
  --heat-low-bg:        var(--bg-card);
  --heat-low-border:    #10B981;
  --heat-low-fg:        #047857;
  --heat-medium-bg:     var(--bg-card);
  --heat-medium-border: #D97706;
  --heat-medium-fg:     #B45309;
  --heat-high-bg:       var(--bg-card);
  --heat-high-border:   #DC2626;
  --heat-high-fg:       #B91C1C;
  --exec-script-bg:      #EEF2FF;
  --exec-script-fg:      #2563EB;
  --exec-script-border:  rgba(37, 99, 235, 0.22);
  --exec-ai_agent-bg:    #F5F3FF;
  --exec-ai_agent-fg:    #7C3AED;
  --exec-ai_agent-border:rgba(124, 58, 237, 0.22);
  --exec-manual-bg:      #F0F0F0;
  --exec-manual-fg:      #525252;
  --exec-manual-border:  #D4D4D4;
  --phase-spec-bg:    rgba(124, 58, 237, 0.10); --phase-spec-fg:    #7C3AED;
  --phase-dev-bg:     rgba(37, 99, 235, 0.10);  --phase-dev-fg:     #2563EB;
  --phase-test-bg:    rgba(217, 119, 6, 0.10);  --phase-test-fg:    #D97706;
  --phase-release-bg: rgba(5, 150, 105, 0.10);  --phase-release-fg: #059669;
  --phase-ops-bg:     rgba(219, 39, 119, 0.10); --phase-ops-fg:     #DB2777;
  --edge-seq:         #525252;
  --edge-skip:        #D97706;
  --edge-parallel:    #10B981;
  --edge-highlight:   #2563EB;
  --ok:              #10B981;
  --warn:            #D97706;
  --danger:          #DC2626;
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"] {
  --bg:              #0B0B0F;
  --bg-elevated:     #121218;
  --bg-card:         #121218;
  --bg-card-hover:   #16161D;
  --bg-input:        #0F0F14;
  --bg-overlay:      rgba(255, 255, 255, 0.02);
  --bg-subtle:       #16161D;
  --bg-inset:        #0F0F14;
  --border:          #23232C;
  --border-strong:   #2F2F3A;
  --border-soft:     #1A1A22;
  --text-primary:    #EDEDF0;
  --text-secondary:  #9A9AA8;
  --text-muted:      #5F5F6E;
  --text-inverse:    #0B0B0F;
  --accent:          #7AA5FF;
  --accent-dim:      #5687E8;
  --accent-soft:     rgba(122, 165, 255, 0.10);
  --accent-glow:     rgba(122, 165, 255, 0.25);
  --status-draft-bg:        rgba(245, 158, 11, 0.10);
  --status-draft-border:    #F59E0B;
  --status-draft-fg:        #FBBF24;
  --status-review-bg:       rgba(122, 165, 255, 0.10);
  --status-review-border:   #7AA5FF;
  --status-review-fg:       #A4C2FF;
  --status-stable-bg:       rgba(52, 211, 153, 0.10);
  --status-stable-border:   #34D399;
  --status-stable-fg:       #6EE7B7;
  --status-deprecated-bg:   #1A1A22;
  --status-deprecated-border:#2F2F3A;
  --status-deprecated-fg:   #5F5F6E;
  --heat-low-border:    #34D399;
  --heat-low-fg:        #6EE7B7;
  --heat-medium-border: #F59E0B;
  --heat-medium-fg:     #FBBF24;
  --heat-high-border:   #F87171;
  --heat-high-fg:       #FCA5A5;
  --exec-script-bg:      rgba(122, 165, 255, 0.10);
  --exec-script-fg:      #7AA5FF;
  --exec-script-border:  rgba(122, 165, 255, 0.30);
  --exec-ai_agent-bg:    rgba(183, 157, 255, 0.10);
  --exec-ai_agent-fg:    #B79DFF;
  --exec-ai_agent-border:rgba(183, 157, 255, 0.30);
  --exec-manual-bg:      rgba(154, 154, 168, 0.10);
  --exec-manual-fg:      #9A9AA8;
  --exec-manual-border:  rgba(154, 154, 168, 0.30);
  --phase-spec-bg:    rgba(183, 157, 255, 0.12); --phase-spec-fg:    #B79DFF;
  --phase-dev-bg:     rgba(122, 165, 255, 0.12); --phase-dev-fg:     #7AA5FF;
  --phase-test-bg:    rgba(245, 158, 11, 0.12);  --phase-test-fg:    #F59E0B;
  --phase-release-bg: rgba(52, 211, 153, 0.12);  --phase-release-fg: #34D399;
  --phase-ops-bg:     rgba(244, 114, 182, 0.12); --phase-ops-fg:     #F472B6;
  --edge-seq:         #9A9AA8;
  --edge-skip:        #F59E0B;
  --edge-parallel:    #34D399;
  --edge-highlight:   #7AA5FF;
  --ok:              #34D399;
  --warn:            #F59E0B;
  --danger:          #F87171;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 1.55;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01";
}
body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

::selection { background: var(--accent-soft); color: var(--text-primary); }

/* ── Top bar (Engineering Console) ──────────────────────── */
.tb {
  flex: 0 0 auto;
  height: 44px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 14px;
}
.tb-logo { display: flex; align-items: center; gap: 8px; }
.tb-logo-mark {
  width: 20px; height: 20px;
  border-radius: 5px;
  background: var(--accent);
  color: #FFFFFF;
  font-weight: 700;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
}
.tb-logo-name {
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
.tb-divider { width: 1px; height: 16px; background: var(--border); }
.tb-crumb {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
}
.tb-crumb-sep { color: var(--text-muted); }
.tb-crumb-leaf { color: var(--text-primary); font-weight: 500; }
.tb-spacer { flex: 1; }
.tb-theme {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg-elevated);
  overflow: hidden;
}
.tb-theme-btn {
  padding: 4px 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: background .15s var(--ease), color .15s var(--ease);
}
.tb-theme-btn:hover { color: var(--text-primary); }
.tb-theme-btn.active {
  background: var(--bg-subtle);
  color: var(--text-primary);
  font-weight: 500;
}

/* ── Header (process title strip) ──────────────────────── */
header.proc-head {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 16px 24px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
header.proc-head h1 {
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.2;
}
header.proc-head .subtitle {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
}

/* ── Legend ─────────────────────────────────────────────── */
.legend-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 16px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  font-size: 10.5px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.lswatch {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-card);
}
.lpill {
  height: 16px;
  padding: 0 6px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  border-radius: 3px;
  border: 1px solid transparent;
}
.pill-script   { background: var(--exec-script-bg);   color: var(--exec-script-fg); }
.pill-ai_agent { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); }
.pill-manual   { background: var(--exec-manual-bg);   color: var(--exec-manual-fg); }
.pill-branch-always      { background: var(--bg-subtle); color: var(--text-secondary); }
.pill-branch-conditional { background: rgba(217, 119, 6, 0.10); color: var(--warn); }
.pill-branch-ref         { background: var(--bg-subtle); color: var(--text-muted); }
.pill {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid transparent;
  letter-spacing: 0;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
}
.pill.no-mono { font-family: var(--font-body); }

/* Outgoing branches table */
.branch-table {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.branch-head, .branch-row {
  display: grid;
  grid-template-columns: 100px 1.6fr 0.9fr;
  align-items: center;
}
.branch-head {
  padding: 8px 14px;
  font-size: 10px;
  color: var(--text-secondary);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--bg-inset);
  border-bottom: 1px solid var(--border);
}
.branch-row {
  padding: 10px 14px;
  font-size: 12px;
  border-bottom: 1px solid var(--border-soft);
}
.branch-row:last-child { border-bottom: none; }
.branch-next { color: var(--text-primary); font-weight: 500; }
.branch-next-link {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
}
.branch-next-link:hover { text-decoration: underline; }
.branch-cond {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

/* ── Filter bar ─────────────────────────────────────────── */
.filter-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 4px; }
.filter-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  margin-right: 4px;
}
.filter-btn {
  font-family: var(--font-body);
  font-size: 10.5px;
  padding: 3px 9px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border-radius: 5px;
  transition: color .15s var(--ease), border-color .15s var(--ease), background .15s var(--ease);
  line-height: 1.4;
}
.filter-btn:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--bg-subtle); }
.filter-btn.active {
  background: var(--accent);
  color: #FFFFFF;
  border-color: var(--accent);
}
.filter-search {
  font-family: var(--font-mono);
  border: 1px solid var(--border);
  background: var(--bg-input);
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-primary);
  outline: none;
  width: 160px;
  border-radius: 5px;
}
.filter-search:focus { border-color: var(--accent); }
.filter-search::placeholder { color: var(--text-muted); }

/* ── Layout ─────────────────────────────────────────────── */
.layout {
  flex: 1 1 0;
  display: flex;
  min-height: 0;
}
.flow-area {
  flex: 0 0 auto;
  min-width: 360px;
  max-width: 60vw;
  overflow: auto;
  background: var(--bg-elevated);
  border-right: 1px solid var(--border);
  padding: 18px 20px 40px;
}
.flow-canvas { position: relative; }
svg.arrows-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}

/* ── Node ───────────────────────────────────────────────── */
.node {
  position: absolute;
  width: 200px;
  height: 54px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 9px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  transition: border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  user-select: none;
  font-family: var(--font-body);
}
.node:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
.node.selected {
  border-color: var(--accent);
  border-width: 1.5px;
  background: var(--accent-soft);
  box-shadow: 0 1px 3px var(--accent-glow);
  z-index: 5;
}
.node.core-true  { border-left: 3px solid var(--danger); }
.node.core-false { border-left: 3px solid var(--border-strong); }
.node.heat-low    { border-left: 3px solid var(--heat-low-border); }
.node.heat-medium { border-left: 3px solid var(--heat-medium-border); }
.node.heat-high   { border-left: 3px solid var(--heat-high-border); }
.node.core-true.heat-low,
.node.core-true.heat-medium,
.node.core-true.heat-high { border-left-color: var(--danger); }

.node.status-draft      { background: var(--status-draft-bg); }
.node.status-review     { background: var(--status-review-bg); }
.node.status-stable     { background: var(--bg-card); }
.node.status-deprecated {
  background: var(--status-deprecated-bg);
  border-color: var(--status-deprecated-border);
  opacity: 0.55;
}
.node.status-deprecated .node-name { text-decoration: line-through; }

.node-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.25;
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.node.selected .node-name {
  font-weight: 600;
  color: var(--accent);
}
.node-badges { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
.badge {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  line-height: 1.5;
  border: 1px solid transparent;
}
.badge-script   { background: var(--exec-script-bg);   color: var(--exec-script-fg); }
.badge-ai_agent { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); }
.badge-manual   { background: var(--exec-manual-bg);   color: var(--exec-manual-fg); }
.badge-core     { background: rgba(220, 38, 38, 0.10); color: var(--danger); }
.badge-heat-low    { background: transparent; color: var(--heat-low-fg);    border-color: var(--heat-low-border); }
.badge-heat-medium { background: transparent; color: var(--heat-medium-fg); border-color: var(--heat-medium-border); }
.badge-heat-high   { background: transparent; color: var(--heat-high-fg);   border-color: var(--heat-high-border); }
.badge-cost {
  margin-left: auto;
  background: transparent;
  color: var(--text-secondary);
  font-size: 10px;
}

/* ── Detail panel ──────────────────────────────────────── */
.detail-panel {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 24px 28px 48px;
  background: var(--bg);
  min-width: 0;
}
.detail-empty {
  height: 100%;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.detail-header {
  padding-bottom: 16px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.detail-unit-name {
  font-weight: 700;
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.detail-aim {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 12px;
  max-width: 640px;
}
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid transparent;
  display: inline-flex; align-items: center;
}
.tag.no-mono { font-family: var(--font-body); }
.tag-phase      { background: var(--bg-subtle); color: var(--text-secondary); }
.tag-phase.spec    { background: var(--phase-spec-bg);    color: var(--phase-spec-fg); }
.tag-phase.dev     { background: var(--phase-dev-bg);     color: var(--phase-dev-fg); }
.tag-phase.test    { background: var(--phase-test-bg);    color: var(--phase-test-fg); }
.tag-phase.release { background: var(--phase-release-bg); color: var(--phase-release-fg); }
.tag-phase.ops     { background: var(--phase-ops-bg);     color: var(--phase-ops-fg); }
.tag-core-true  { background: rgba(220, 38, 38, 0.10); color: var(--danger); }
.tag-core-false { background: var(--bg-subtle); color: var(--text-muted); }
.tag-script     { background: var(--exec-script-bg);   color: var(--exec-script-fg); }
.tag-ai_agent   { background: var(--exec-ai_agent-bg); color: var(--exec-ai_agent-fg); }
.tag-manual     { background: var(--exec-manual-bg);   color: var(--exec-manual-fg); }
.tag-status-draft      { background: var(--status-draft-bg);      color: var(--status-draft-fg); }
.tag-status-review     { background: var(--status-review-bg);     color: var(--status-review-fg); }
.tag-status-stable     { background: var(--status-stable-bg);     color: var(--status-stable-fg); }
.tag-status-deprecated { background: var(--status-deprecated-bg); color: var(--status-deprecated-fg); }

.section { margin-bottom: 22px; }
.section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.item-list {
  list-style: none;
  padding: 0;
  font-size: 12.5px;
  color: var(--text-primary);
  line-height: 1.7;
}
.item-list li {
  padding-left: 14px;
  position: relative;
}
.item-list li::before {
  content: "›";
  position: absolute;
  left: 0;
  color: var(--accent);
  font-size: 12px;
  top: 0;
}
.io-grid { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 10px; }
.io-box {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
.io-box-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.io-box-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.io-box-in      .io-box-dot { background: var(--accent); }
.io-box-process .io-box-dot { background: var(--exec-ai_agent-fg); }
.io-box-out     .io-box-dot { background: var(--ok); }
.io-box-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
}
.io-box ul {
  list-style: none;
  padding: 0;
  font-size: 12px;
  color: var(--text-primary);
  line-height: 1.5;
}
.io-box ul li { padding: 3px 0; }

.executor-box {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
.executor-reason {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 8px;
  line-height: 1.55;
}

.deprecated-banner {

  color: var(--status-deprecated-fg);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  border-left: 3px solid var(--warn);
  padding: 10px 14px;
  line-height: 1.55;
}

.link-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 9px;
  background: var(--bg-inset);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
}
.link-chip:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.link-chip-ext {
  background: var(--exec-ai_agent-bg);
  color: var(--exec-ai_agent-fg);
  border-color: var(--exec-ai_agent-border);
  cursor: default;
}
.link-chip-ext:hover {
  background: var(--exec-ai_agent-bg);
  color: var(--exec-ai_agent-fg);
  border-color: var(--exec-ai_agent-border);
}
.link-empty {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

/* Metric strip — 5-column grid with hairline separators */
.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.meta-item {
  background: var(--bg-elevated);
  padding: 12px 14px;
}
.meta-key {
  font-size: 10.5px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.meta-val {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}
.meta-diff-low    { color: var(--ok); }
.meta-diff-medium { color: var(--warn); }
.meta-diff-high   { color: var(--danger); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

<script>
const units     = {

    ],
    "rule": [

    ],
    "io": {

      ],
      "process": [

      ],

      ]
    },
    "executor": {

      "reason": "ログ・コードから原因を推論・絞り込む分析に推論能力が必要なため"
    },

    },
    "lifecycle_status": "stable",
    "deprecated_reason": null,
    "parallel_with": []
  },
  "回帰テスト": {

    "phase": "dev",
    "core": true,
    "scope": [
      "自動テストスイートの全件 PASS 確認",
      "修正関連機能の手動動作確認"
    ],
    "rule": [
      "全テストが PASS してからデプロイを進める",
      "修正で既存テストが FAIL した場合は修正を見直す（テストを弱めない）"
    ],
    "io": {
      "in": [
        "修正済みコード（テスト付き）"
      ],
      "process": [
        "自動テストスイートを実行",
        "関連機能を手動確認"
      ],
      "out": [
        "回帰テスト結果（全 PASS）"
      ]
    },
    "executor": {
      "type": "script",
      "reason": "テストスイートの実行は CI で自動化できるため"
    },
    "link": {
      "up": [
        "修正実装"
      ],
      "down": [
        "デプロイ"
      ]
    },
    "depends_on": [],
    "effort": {
      "duration": 0.5,
      "frequency": 8
    },
    "automation": {
      "difficulty": "low",
      "status": "automated"
    },
    "lifecycle_status": "stable",
    "deprecated_reason": null,
    "parallel_with": []
  }
};
const positions = {"バグ再現確認": {"left": 40, "top": 24}, "原因特定": {"left": 40, "top": 134}, "修正実装": {"left": 40, "top": 244}, "回帰テスト": {"left": 40, "top": 354}, "デプロイ": {"left": 40, "top": 464}};
const edges     = [["バグ再現確認", "原因特定", "seq"], ["修正実装", "回帰テスト", "seq"], ["原因特定", "修正実装", "seq"], ["回帰テスト", "デプロイ", "seq"]];

const W = 200, H = 54;
const canvas     = document.getElementById("canvas");
const detailPane = document.getElementById("detail-panel");

function cssVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
const COLOR = new Proxy({}, {
  get(_, key) {
    const map = {
      EDGE_SEQ:        ["--edge-seq",       "#525252"],
      EDGE_SKIP:       ["--edge-skip",      "#D97706"],
      EDGE_PARALLEL:   ["--edge-parallel",  "#10B981"],
      EDGE_HIGHLIGHT:  ["--edge-highlight", "#2563EB"],
    };
    const e = map[key];
    return e ? cssVar(e[0], e[1]) : "";
  }
});

// ── SVG arrows ──────────────────────────────────────────
const NS  = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(NS, "svg");
svg.classList.add("arrows-layer");
svg.setAttribute("viewBox", "0 0 280 542");

const defs = document.createElementNS(NS, "defs");
[["arrowhead", COLOR.EDGE_SEQ], ["arrowhead-skip", COLOR.EDGE_SKIP], ["arrowhead-hl", COLOR.EDGE_HIGHLIGHT]].forEach(([id, color]) => {
  const m = document.createElementNS(NS, "marker");
  Object.entries({ id, markerWidth:"9", markerHeight:"7", refX:"8", refY:"3.5", orient:"auto" })
    .forEach(([k, v]) => m.setAttribute(k, v));
  const p = document.createElementNS(NS, "polygon");
  p.setAttribute("points", "0 0, 9 3.5, 0 7");
  p.setAttribute("fill", color);
  m.appendChild(p);
  defs.appendChild(m);
});
svg.appendChild(defs);

edges.forEach(([from, to, etype]) => {
  const fp = positions[from], tp = positions[to];
  if (!fp || !tp) return;
  const isParallel = etype === "parallel";
  const fx = fp.left + W / 2, fy = fp.top + H / 2;
  const tx = tp.left + W / 2, ty = tp.top + H / 2;
  const fxb = fp.left + W / 2, fyb = fp.top + H;
  const txb = tp.left + W / 2, tyb = tp.top;
  const path = document.createElementNS(NS, "path");
  let d;
  if (isParallel) {
    const my = (fy + ty) / 2;
    d = `M ${fx} ${fy} C ${fx} ${my} ${tx} ${my} ${tx} ${ty}`;
  } else {
    const sameCol = Math.abs(fxb - txb) < 2;
    const isSkip  = sameCol && (tyb - fyb) > 100;
    if (sameCol && !isSkip) {
      d = `M ${fxb} ${fyb} L ${txb} ${tyb - 1}`;
    } else if (isSkip) {
      const ox = fp.left - 40;
      d = `M ${fxb} ${fyb} C ${ox} ${fyb + 20} ${ox} ${tyb - 20} ${txb} ${tyb - 1}`;
    } else {
      const my = (fyb + tyb) / 2;
      d = `M ${fxb} ${fyb} C ${fxb} ${my} ${txb} ${my} ${txb} ${tyb - 1}`;
    }
  }
  const sameColSeq = !isParallel && Math.abs(fxb - txb) < 2;
  const isSkipSeq  = sameColSeq && (tp.top - fp.top - H) > 100;
  path.setAttribute("d", d);
  path.setAttribute("stroke", isParallel ? COLOR.EDGE_PARALLEL : isSkipSeq ? COLOR.EDGE_SKIP : COLOR.EDGE_SEQ);
  path.setAttribute("stroke-width", "1.5");
  path.setAttribute("stroke-dasharray", isParallel ? "4 3" : isSkipSeq ? "5 3" : "none");
  path.setAttribute("fill", "none");
  if (!isParallel) path.setAttribute("marker-end", isSkipSeq ? "url(#arrowhead-skip)" : "url(#arrowhead)");
  path.dataset.from = from;
  path.dataset.to   = to;
  path.dataset.skip     = isSkipSeq ? "true" : "false";
  path.dataset.parallel = isParallel ? "true" : "false";
  svg.appendChild(path);
});

canvas.appendChild(svg);

function highlightEdges(name) {
  svg.querySelectorAll("path[data-from]").forEach(p => {
    const skip     = p.dataset.skip === "true";
    const parallel = p.dataset.parallel === "true";
    const hit  = p.dataset.from === name || p.dataset.to === name;
    if (hit) {
      p.setAttribute("stroke", COLOR.EDGE_HIGHLIGHT);
      p.setAttribute("stroke-width", "2.5");
      p.setAttribute("stroke-dasharray", "none");
      p.setAttribute("opacity", "1");
      p.setAttribute("marker-end", "url(#arrowhead-hl)");
    } else {
      p.setAttribute("stroke", parallel ? COLOR.EDGE_PARALLEL : skip ? COLOR.EDGE_SKIP : COLOR.EDGE_SEQ);
      p.setAttribute("stroke-width", "1.5");
      p.setAttribute("stroke-dasharray", parallel ? "4 3" : skip ? "5 3" : "none");
      p.setAttribute("opacity", "0.2");
      if (!parallel) p.setAttribute("marker-end", skip ? "url(#arrowhead-skip)" : "url(#arrowhead)");
    }
  });
}

// ── Heat map ──────────────────────────────────────────────
function computeHeat(unitMap) {
  const costs = Object.entries(unitMap)
    .map(([n, u]) => {
      const d = u.effort && u.effort.duration, f = u.effort && u.effort.frequency;
      return (d != null && f != null) ? {name: n, cost: d * f} : null;
    }).filter(Boolean);
  if (!costs.length) return {};
  const sorted = [...costs].sort((a, b) => a.cost - b.cost);
  const n = sorted.length;
  const heat = {};
  sorted.forEach(({name, cost}, i) => {
    heat[name] = i < Math.ceil(n / 3) ? "low" : i < Math.ceil(2 * n / 3) ? "medium" : "high";
  });
  return heat;
}
const heatMap = computeHeat(units);
if (Object.keys(heatMap).length) document.getElementById("heat-legend").style.display = "flex";
if (Object.values(units).some(u => u.lifecycle_status)) document.getElementById("status-legend").style.display = "flex";

// ── Nodes ────────────────────────────────────────────────
Object.entries(positions).forEach(([name, pos]) => {
  const u   = units[name];
  if (!u) return;
  const div = document.createElement("div");
  const heatClass   = heatMap[name] ? ` heat-${heatMap[name]}` : "";
  const statusClass = u.lifecycle_status ? ` status-${u.lifecycle_status}` : "";
  div.className    = `node core-${u.core}${heatClass}${statusClass}`;
  div.style.left   = pos.left + "px";
  div.style.top    = pos.top  + "px";
  div.dataset.name = name;

  const costVal = (u.effort.duration != null && u.effort.frequency != null)
    ? u.effort.duration * u.effort.frequency : null;
  div.innerHTML = `
    <div class="node-name">${name}</div>
    <div class="node-badges">
      <span class="badge badge-${u.executor.type}">${u.executor.type}</span>
      ${u.core ? '<span class="badge badge-core">core</span>' : ''}
      ${costVal != null ? `<span class="badge badge-heat-${heatMap[name]}">${costVal}h/mo</span>` : ''}
    </div>`;

  div.addEventListener("click", () => {
    document.querySelectorAll(".node.selected").forEach(n => n.classList.remove("selected"));
    div.classList.add("selected");
    highlightEdges(name);
    renderDetail(name);
  });

  canvas.appendChild(div);
});

// ── Detail panel ─────────────────────────────────────────
function renderDetail(name) {
  const u = units[name];
  const chips = (arr) =>
    arr.length
      ? arr.map(n => `<span class="link-chip" onclick="jumpTo('${n.replace(/'/g, "\'")}')">${n}</span>`).join("")
      : `<span class="link-empty">none</span>`;

  detailPane.innerHTML = `
    <div class="detail-header">
      <div class="detail-unit-name">${name}</div>
      <div class="detail-aim">${u.aim}</div>
      <div class="detail-tags">
        <span class="tag tag-phase no-mono ${u.phase || ''}">${u.phase || ''}</span>
        <span class="tag tag-core-${u.core} no-mono">core · ${u.core}</span>
        <span class="tag tag-${u.executor.type}">${u.executor.type}</span>
        ${u.lifecycle_status ? `<span class="tag tag-status-${u.lifecycle_status} no-mono">${u.lifecycle_status}</span>` : ''}
      </div>
    </div>

    ${u.lifecycle_status === 'deprecated' && u.deprecated_reason ? `
    <div class="section">
      <div class="section-label">Deprecated</div>
      <div class="deprecated-banner">${u.deprecated_reason}</div>
    </div>` : ''}

    <div class="section">
      <div class="section-label">Scope</div>
      <ul class="item-list">${u.scope.map(s => `<li>${s}</li>`).join("")}</ul>
    </div>

    <div class="section">
      <div class="section-label">Rule</div>
      <ul class="item-list">${u.rule.map(r => `<li>${r}</li>`).join("")}</ul>
    </div>

    <div class="section">
      <div class="section-label">IO</div>
      <div class="io-grid">
        <div class="io-box io-box-in">
          <div class="io-box-label">In</div>
          <ul>${u.io.in.map(i => `<li>${i}</li>`).join("")}</ul>
        </div>
        <div class="io-box io-box-process">
          <div class="io-box-label">Process</div>
          <ul>${u.io.process.map(p => `<li>${p}</li>`).join("")}</ul>
        </div>
        <div class="io-box io-box-out">
          <div class="io-box-label">Out</div>
          <ul>${u.io.out.map(o => `<li>${o}</li>`).join("")}</ul>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Executor</div>
      <div class="executor-box">
        <span class="badge badge-${u.executor.type}" style="font-size:10.5px;padding:2px 8px;">${u.executor.type}</span>
        <div class="executor-reason">${u.executor.reason}</div>
      </div>
    </div>

    ${(u.effort.duration != null || u.effort.frequency != null || u.automation.difficulty || u.automation.status || (u.link.down && u.link.down.length)) ? `
    <div class="section">
      <div class="section-label">Effort / Automation</div>
      <div class="meta-grid">
        ${u.effort.duration != null ? `<div class="meta-item"><div class="meta-key">所要時間</div><div class="meta-val">${u.effort.duration}h</div></div>` : ''}
        ${u.effort.frequency != null ? `<div class="meta-item"><div class="meta-key">月間頻度</div><div class="meta-val">${u.effort.frequency}回/月</div></div>` : ''}
        ${(u.effort.duration != null && u.effort.frequency != null) ? (() => { const cost = u.effort.duration * u.effort.frequency; const diffNum = {low:1,medium:2,high:3}[u.automation.difficulty] || null; const lev = diffNum ? Math.round(cost / diffNum * 10) / 10 : null; let html = '<div class="meta-item"><div class="meta-key">月間コスト</div><div class="meta-val">' + cost + 'h/月</div></div>'; if (lev != null) { html += '<div class="meta-item"><div class="meta-key">自動化レバレッジ</div><div class="meta-val">' + lev + '</div></div>'; } return html; })() : ''}
        ${u.automation.difficulty ? `<div class="meta-item"><div class="meta-key">自動化難易度</div><div class="meta-val meta-diff-${u.automation.difficulty}">${u.automation.difficulty}</div></div>` : ''}
        ${u.automation.status ? `<div class="meta-item"><div class="meta-key">自動化状況</div><div class="meta-val">${u.automation.status}</div></div>` : ''}
        ${(u.link.down && u.link.down.length) ? `<div class="meta-item"><div class="meta-key">Branches</div><div class="meta-val">${u.link.down.length}</div></div>` : ''}
      </div>
    </div>` : ''}

    ${(u.link.down && u.link.down.length >= 2) ? `
    <div class="section">
      <div class="section-label">Outgoing branches</div>
      <div class="branch-table">
        <div class="branch-head">
          <div>Kind</div><div>Next unit</div><div>Condition</div>
        </div>
        ${u.link.down.map(n => `
          <div class="branch-row">
            <div><span class="pill pill-branch-always no-mono">always</span></div>
            <div class="branch-next">→ <span class="branch-next-link" onclick="jumpTo('${n.replace(/'/g, "\\'")}')">${n}</span></div>
            <div class="branch-cond">—</div>
          </div>`).join("")}
      </div>
    </div>` : ''}

    <div class="section">
      <div class="section-label">Link · Up</div>
      <div class="link-chips">${chips(u.link.up)}</div>
    </div>
    <div class="section">
      <div class="section-label">Link · Down</div>
      <div class="link-chips">${chips(u.link.down)}</div>
    </div>
    ${u.depends_on && u.depends_on.length ? `
    <div class="section">
      <div class="section-label">Depends On (cross-process)</div>
      <div class="link-chips">${u.depends_on.map(d => '<span class="link-chip link-chip-ext" title="' + d + '">' + d + '</span>').join("")}</div>
    </div>` : ''}`;
}

function jumpTo(name) {
  const el = document.querySelector(`.node[data-name="${CSS.escape(name)}"]`);
  if (!el) return;
  document.querySelectorAll(".node.selected").forEach(n => n.classList.remove("selected"));
  el.classList.add("selected");
  renderDetail(name);
  el.scrollIntoView({ behavior: "smooth", block: "center" });
}

// ── Filter ───────────────────────────────────────────────
const filterState = { core: "all", executor: "all", phase: "all", status: "all", search: "" };

function applyFilter() {
  const q = filterState.search.toLowerCase();
  document.querySelectorAll(".node[data-name]").forEach(el => {
    const name = el.dataset.name;
    const u = units[name];
    if (!u) return;
    const match =
      (filterState.core     === "all" || String(u.core) === filterState.core) &&
      (filterState.executor === "all" || u.executor.type === filterState.executor) &&
      (filterState.phase    === "all" || u.phase === filterState.phase) &&
      (filterState.status   === "all" || (u.lifecycle_status || "") === filterState.status) &&
      (!q || name.toLowerCase().includes(q) || u.aim.toLowerCase().includes(q));
    el.style.opacity       = match ? "1" : "0.1";
    el.style.pointerEvents = match ? "" : "none";
  });
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const f = btn.dataset.filter, v = btn.dataset.val;
    filterState[f] = v;
    document.querySelectorAll(`.filter-btn[data-filter="${f}"]`).forEach(b => b.classList.toggle("active", b === btn));
    applyFilter();
  });
});
document.getElementById("filter-search").addEventListener("input", e => {
  filterState.search = e.target.value;
  applyFilter();
});

// Populate phase filter
const phases = [...new Set(Object.values(units).map(u => u.phase).filter(Boolean))].sort();
if (phases.length > 1) {
  const pg = document.getElementById("phase-filter-group");
  pg.style.display = "";
  phases.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "filter-btn"; btn.dataset.filter = "phase"; btn.dataset.val = p; btn.textContent = p;
    pg.appendChild(btn);
  });
}

// Populate status filter
const statuses = [...new Set(Object.values(units).map(u => u.lifecycle_status).filter(Boolean))].sort();
if (statuses.length) {
  const sg = document.getElementById("status-filter-group");
  sg.style.display = "";
  statuses.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "filter-btn"; btn.dataset.filter = "status"; btn.dataset.val = s; btn.textContent = s;
    sg.appendChild(btn);
  });
}

// ── Theme toggle (light/dark) ─────────────────────────────
function retintEdges() {
  // Re-evaluate stroke colors after CSS vars change
  const sel = document.querySelector(".node.selected");
  const selName = sel ? sel.dataset.name : null;
  // Update marker fills (defs are static, need to repaint)
  svg.querySelectorAll("defs marker polygon").forEach((p, i) => {
    const colors = [COLOR.EDGE_SEQ, COLOR.EDGE_SKIP, COLOR.EDGE_HIGHLIGHT];
    if (colors[i]) p.setAttribute("fill", colors[i]);
  });
  // Update path strokes
  svg.querySelectorAll("path[data-from]").forEach(p => {
    const skip     = p.dataset.skip === "true";
    const parallel = p.dataset.parallel === "true";
    const hit  = selName && (p.dataset.from === selName || p.dataset.to === selName);
    if (hit) p.setAttribute("stroke", COLOR.EDGE_HIGHLIGHT);
    else     p.setAttribute("stroke", parallel ? COLOR.EDGE_PARALLEL : skip ? COLOR.EDGE_SKIP : COLOR.EDGE_SEQ);
  });
}
function applyTheme(theme) {
  document.body.setAttribute("data-theme", theme);
  document.querySelectorAll("[data-theme-set]").forEach(b =>
    b.classList.toggle("active", b.dataset.themeSet === theme));
  try { localStorage.setItem("bizspec-theme", theme); } catch (_) {}
  requestAnimationFrame(retintEdges);
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("bizspec-theme"); } catch (_) {}
  const initial = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(initial);
})();
document.querySelectorAll("[data-theme-set]").forEach(b => {
  b.addEventListener("click", () => applyTheme(b.dataset.themeSet));
});
</script>
</body>
