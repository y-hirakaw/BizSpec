unit: テスト実施
aim: テストケースに従って動作確認を行い、結果を記録する
phase: test
job:
  - テストケースを順番に実行し、PASS/FAIL を記録する
  - FAIL の場合は再現手順・実際の結果・期待結果を記録する
rule:
  - テスト環境はテスト計画書で指定した環境を使う
  - FAIL は握りつぶさずすべて記録する
link:
  up:
    - テストケース作成
  down:
    - バグ起票
    - テスト結果報告
core: true
io:
  in:
    - テストケース一覧
    - テストデータ
  run:
    - テスト環境を準備
    - テストケースを実行・結果を記録
  out:
    - テスト結果（PASS/FAIL リスト）
    - バグ候補リスト
executor:
  type: manual
  reason: 実際の操作・目視確認・判断が必要なテストケースが含まれるため
effort:
  duration: 3
  frequency: 2
automation:
  difficulty: medium
  status: partially-automated
status: stable
