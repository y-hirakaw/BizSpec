unit: テストケース作成
aim: テスト計画に基づいてテストケースを作成する
phase: test
scope:
  - テストケース一覧の作成と網羅性の担保
  - テストデータの整備
rule:
  - テストケースは再現可能で独立していること
  - 期待結果を事前に明記する（テスト後に決めない）
link:
  up:
    - テスト計画作成
  down:
    - テスト実施
core: true
io:
  in:
    - テスト計画書
    - 仕様書・受け入れ条件
  process:
    - 機能ごとにテスト観点を洗い出し
    - テストケース・テストデータを作成
  out:
    - テストケース一覧
    - テストデータ
executor:
  type: ai_agent
  reason: 仕様から網羅的なテスト観点を導出する推論が必要なため
effort:
  duration: 2
  frequency: 2
automation:
  difficulty: medium
  status: partially-automated
status: stable
