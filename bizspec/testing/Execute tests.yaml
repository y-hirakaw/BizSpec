unit: Execute tests
aim: テストケースに従って動作確認を行い、結果を記録する
phase: test
scope:
- テストケース実行と PASS/FAIL の記録
- FAIL 時の再現手順・実際結果・期待結果の記録
rule:
- テスト環境はテスト計画書で指定した環境を使う
- FAIL は握りつぶさずすべて記録する
link:
  up:
  - Write test cases
  down:
  - File bug
  - Report test results
core: true
io:
  in:
  - テストケース一覧
  - テストデータ
  process:
  - テスト環境を準備
  - テストケースを実行・結果を記録
  out:
  - テスト結果（PASS/FAIL リスト）
  - バグ候補リスト
executor:
  type: manual
  reason: 実際の操作・目視確認・判断が必要なテストケースが含まれるため
effort:
  duration: 3
  frequency: 2
automation:
  difficulty: medium
  status: partially-automated
status: stable
