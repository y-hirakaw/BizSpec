unit: ユニットテスト作成
aim: 実装したロジックを検証するユニットテストを作成する
phase: dev
scope:
  - 正常系・異常系・境界値を網羅したユニットテストの整備
  - 全件パスとカバレッジ目標の達成
rule:
  - カバレッジ 80% 以上を目標とする
  - 外部依存はモックを使う
  - テスト名は「何をテストしているか」が分かる命名にする
link:
  up:
    - 実装
  down:
    - セルフレビュー
core: true
io:
  in:
    - 実装済みコード
  process:
    - テストケース洗い出し
    - テスト実装・実行
  out:
    - ユニットテストコード（全件パス）
executor:
  type: manual
  reason: テストケースの設計には実装意図の理解と判断が必要なため
effort:
  duration: 1
  frequency: 20
automation:
  difficulty: medium
  status: manual
status: stable
