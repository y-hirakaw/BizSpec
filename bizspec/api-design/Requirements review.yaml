- 要件は利用者の視点で整理する（実装都合を先行させない）
- 曖昧な要件は設計前に合意しておく
link:
  up: []
  down:
  - Interface design
core: true
io:
  in:
  - ユースケース記述
  - 非機能要件
  process:
  - 利用者からヒアリング
  - 要件を整理・合意
  out:
  - 確認済み要件書
executor:
  type: manual
  reason: 利用者との対話による要件確認と合意が必要なため
effort:
  duration: 1
  frequency: 2
automation:
  difficulty: high
  status: manual
status: stable
