unit: 設計レビュー
aim: 設計の一貫性・RESTful 原則・セキュリティ要件を確認し、承認する
phase: spec
job:
  - エンドポイント設計が RESTful 原則・命名規則に準拠しているか確認する
  - 認証・認可・入力バリデーションの漏れがないか確認する
  - 利用者（フロントエンドチーム等）に設計を確認してフィードバックをもらう
rule:
  - セキュリティ上の問題（認証なしエンドポイント・過剰なデータ露出）はブロッカー
  - フィードバックは設計者と合意してから OpenAPI 定義に進む
link:
  up:
    - インターフェース設計
  down:
    - OpenAPI定義作成
core: true
io:
  in:
    - API インターフェース設計書（ドラフト）
  run:
    - RESTful 原則・セキュリティをチェック
    - 利用者からフィードバックを取得
    - 設計を修正・承認
  out:
    - 承認済み API インターフェース設計書
executor:
  type: manual
  reason: セキュリティ判断と利用者との合意は人間の判断が必要なため
effort:
  duration: 1
  frequency: 2
automation:
  difficulty: medium
  status: partially-automated
status: stable
