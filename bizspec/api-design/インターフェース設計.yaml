unit: インターフェース設計
aim: エンドポイント・リクエスト/レスポンス構造・エラーコードを設計する
phase: spec
job:
  - RESTful 原則に従ってエンドポイント・HTTP メソッドを設計する
  - リクエスト・レスポンスのスキーマを定義する
  - エラーコード・エラーレスポンスの体系を設計する
rule:
  - リソース名は名詞・複数形を使う（/users, /orders）
  - エラーレスポンスは一貫したフォーマットにする
  - 破壊的変更は /v2 などのバージョニングで対応する
link:
  up:
    - 要件確認
  down:
    - 設計レビュー
core: true
io:
  in:
    - 確認済み要件書
  run:
    - エンドポイント・スキーマを設計
    - エラーコード体系を定義
  out:
    - API インターフェース設計書（ドラフト）
executor:
  type: ai_agent
  reason: 要件からエンドポイント・スキーマを体系的に設計する推論が必要なため
effort:
  duration: 2
  frequency: 2
automation:
  difficulty: medium
  status: partially-automated
status: stable
