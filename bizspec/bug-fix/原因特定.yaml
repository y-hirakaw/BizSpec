unit: 原因特定
aim: バグの原因となるコードや設定を特定する
phase: dev
scope:
  - 根本原因（コード・設定・データ）の特定
  - 原因箇所と再現条件の issue への記録
rule:
  - 症状だけでなく「なぜ起きているか」の根本を特定する
  - 修正しながら原因調査しない（調査と修正は分ける）
link:
  up:
    - バグ再現確認
  down:
    - 修正実装
core: true
io:
  in:
    - 再現確認済みバグ issue
    - ログ・スタックトレース・コード
  process:
    - ログ・トレースを解析して原因箇所を絞り込む
    - 原因コード・設定を特定して記録
  out:
    - 原因特定結果（原因箇所・再現条件）
executor:
  type: ai_agent
  reason: ログ・コードから原因を推論・絞り込む分析に推論能力が必要なため
effort:
  duration: 1
  frequency: 8
automation:
  difficulty: high
  status: partially-automated
status: stable
