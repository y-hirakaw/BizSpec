unit: Regression test
aim: 修正により既存機能が壊れていないことを確認する
phase: dev
rule:
- 全テストが PASS してからデプロイを進める
- 修正で既存テストが FAIL した場合は修正を見直す（テストを弱めない）
link:
  up:
  - Implement fix
  down:
  - Deploy
core: true
io:
  in:
  - 修正済みコード（テスト付き）
  process:
  - 自動テストスイートを実行
  - 関連機能を手動確認
  out:
  - 回帰テスト結果（全 PASS）
executor:
  type: script
  reason: テストスイートの実行は CI で自動化できるため
effort:
  duration: 0.5
  frequency: 8
automation:
  difficulty: low
  status: automated
status: stable
