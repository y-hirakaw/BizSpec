unit: Deploy
aim: バグ修正を本番環境に適用する
phase: dev
rule:
- Hot-fix の場合は緊急デプロイ手順に従う
- デプロイ後 15 分はエラーレートを監視する
link:
  up:
  - Regression test
  down: []
core: true
io:
  in:
  - 回帰テスト結果（全 PASS）
  process:
  - PR をマージ・パイプラインを実行
  - 本番反映を確認・issue クローズ
  out:
  - デプロイ完了・issue クローズ
executor:
  type: script
  reason: CI/CD パイプラインで自動デプロイできるため
depends_on:
- pr-review:Approval decision
effort:
  duration: 0.5
  frequency: 8
automation:
  difficulty: low
  status: automated
status: stable
