unit: 本番デプロイ
aim: 本番環境にリリースをデプロイする
phase: release
job:
  - 本番デプロイパイプラインを実行する
  - デプロイの進行状況を監視する
  - デプロイ完了を確認してステークホルダーに通知する
rule:
  - デプロイ実行前にロールバック手順を確認する
  - ピーク時間帯（9:00-18:00）を避けてデプロイする
  - デプロイ中はインシデント対応できる担当者が待機する
link:
  up:
    - ステージング確認
  down:
    - 動作確認
core: true
io:
  in:
    - ステージング確認結果（OK）
    - リリースブランチ
  run:
    - デプロイパイプラインを起動
    - 完了まで監視・ログ確認
  out:
    - デプロイ完了通知
executor:
  type: script
  reason: CI/CD パイプラインで自動実行できるため
effort:
  duration: 0.5
  frequency: 2
automation:
  difficulty: low
  status: automated
status: stable
