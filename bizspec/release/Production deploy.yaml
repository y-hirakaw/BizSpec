unit: Production deploy
aim: 本番環境にリリースをデプロイする
phase: release
rule:
- デプロイ実行前にロールバック手順を確認する
- ピーク時間帯（9:00-18:00）を避けてデプロイする
- デプロイ中はインシデント対応できる担当者が待機する
link:
  up:
  - Staging check
  down:
  - Smoke test
core: true
io:
  in:
  - ステージング確認結果（OK）
  - リリースブランチ
  process:
  - デプロイパイプラインを起動
  - 完了まで監視・ログ確認
  out:
  - デプロイ完了通知
executor:
  type: script
  reason: CI/CD パイプラインで自動実行できるため
depends_on:
- testing:Report test results
effort:
  duration: 0.5
  frequency: 5
automation:
  difficulty: low
  status: automated
status: stable
