unit: ステージング確認
aim: ステージング環境にデプロイし、本番相当の動作確認を行う
phase: release
job:
  - ステージング環境にリリースブランチをデプロイする
  - 主要フローのスモークテストを実施する
  - パフォーマンス・エラーレートに異常がないか監視する
rule:
  - 本番データを使用しない（本番同等の匿名化データを使う）
  - スモークテストは本番前の最終確認であり、新規バグ探索は行わない
link:
  up:
    - リリースブランチ作成
  down:
    - 本番デプロイ
core: true
io:
  in:
    - リリースブランチ
  run:
    - ステージングにデプロイ
    - スモークテスト実施・監視
  out:
    - ステージング確認結果（OK/NG）
executor:
  type: manual
  reason: 実際の動作を目視・操作で確認する最終チェックが必要なため
effort:
  duration: 1
  frequency: 2
automation:
  difficulty: medium
  status: partially-automated
status: stable
