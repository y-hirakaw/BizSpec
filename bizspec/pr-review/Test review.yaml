unit: Test review
aim: テストコードの網羅性と品質を評価する
phase: dev
rule:
- ハッピーパスのみのテストは必ず異常系の追加を求める
- テスト対象コードに変更があってテストが 0 件の場合はブロック扱いにする
link:
  up:
  - Fetch diff
  down:
  - Approval decision
core: true
io:
  in:
  - 変更ファイル一覧
  - 差分テキスト
  process:
  - テストファイルの diff を重点的に確認する
  - カバレッジの抜けを指摘する
  out:
  - テストレビューコメント一覧（指摘レベル・箇所・内容）
executor:
  type: ai_agent
  reason: テストの意図・網羅性の判断に推論が必要なため
status: stable
effort:
  duration: 1
  frequency: 40
automation:
  difficulty: medium
  status: partially-automated
execution:
  parallel_with:
  - Logic review
