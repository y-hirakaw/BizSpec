unit: テストレビュー
aim: テストコードの網羅性と品質を評価する
phase: dev
job:
  - 追加・変更されたテストケースを確認する
  - 正常系・異常系・境界値のカバレッジを評価する
  - テストが壊れやすい実装（モック過多・実装依存）になっていないか確認する
rule:
  - ハッピーパスのみのテストは必ず異常系の追加を求める
  - テスト対象コードに変更があってテストが 0 件の場合はブロック扱いにする
link:
  up:
    - 差分取得
  down:
    - 承認判定
core: true
io:
  in:
    - 変更ファイル一覧
    - 差分テキスト
  run:
    - テストファイルの diff を重点的に確認する
    - カバレッジの抜けを指摘する
  out:
    - テストレビューコメント一覧（指摘レベル・箇所・内容）
executor:
  type: ai_agent
  reason: テストの意図・網羅性の判断に推論が必要なため
