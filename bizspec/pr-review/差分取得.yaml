unit: 差分取得
aim: レビュー対象の変更内容を取得する
phase: dev
scope:
  - PR 差分テキストの取得
  - 変更ファイル一覧と増減行数のまとめ
rule:
  - 差分が 500 行を超える場合はレビュー依頼前に分割を促す
link:
  up: []
  down:
    - ロジックレビュー
    - テストレビュー
core: true
io:
  in:
    - PR番号
  process:
    - GitHub API (GET /pulls/{number}/files) を呼び出す
    - ファイルパス・patch・変更行数を抽出する
  out:
    - 変更ファイル一覧（ファイルパス・追加行数・削除行数）
    - 差分テキスト
executor:
  type: script
  reason: GitHub API の定型呼び出しで完結するため
depends_on:
  - issue-refinement:Ready判定
  - implementation:PR作成
effort:
  duration: 0.5
  frequency: 40
automation:
  difficulty: low
  status: automated
