unit: Run tests
aim: アップデート後に全テストが通過することを確認する
phase: ops
rule:
- テストが FAIL したまま PR をマージしない
- 既存テストを弱めてパスさせることは禁止
link:
  up:
  - Apply updates
  down: []
core: true
io:
  in:
  - 更新済みロックファイル・依存定義
  process:
  - テストスイートを実行
  - FAIL があれば原因を特定して修正
  out:
  - テスト結果（全 PASS）
executor:
  type: script
  reason: テストスイートの実行は CI で完全自動化できるため
effort:
  duration: 0.5
  frequency: 2
automation:
  difficulty: low
  status: automated
status: stable
