unit: テスト実行
aim: アップデート後に全テストが通過することを確認する
phase: ops
scope:
  - 更新後の自動テスト全件 PASS の保証
  - FAIL 時の破壊的変更影響の特定と対処
rule:
  - テストが FAIL したまま PR をマージしない
  - 既存テストを弱めてパスさせることは禁止
link:
  up:
    - アップデート実施
  down: []
core: true
io:
  in:
    - 更新済みロックファイル・依存定義
  process:
    - テストスイートを実行
    - FAIL があれば原因を特定して修正
  out:
    - テスト結果（全 PASS）
executor:
  type: script
  reason: テストスイートの実行は CI で完全自動化できるため
effort:
  duration: 0.5
  frequency: 2
automation:
  difficulty: low
  status: automated
status: stable
