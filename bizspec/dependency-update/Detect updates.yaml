unit: Detect updates
aim: 依存ライブラリのうち更新が必要なものを洗い出す
phase: ops
scope:
- 古いパッケージ・CVE の網羅的な一覧化
- 優先順位付き更新対象リストの整備
rule:
- Critical・High の CVE は発見から 7 日以内に対応する
- メジャーアップデートは破壊的変更のリリースノートを確認してから進める
link:
  up: []
  down:
  - Assess security impact
core: true
io:
  in:
  - 依存関係ロックファイル（package.json / pyproject.toml 等）
  process:
  - 依存チェックツールを実行
  - CVE・バージョン遅延を一覧化・優先度付与
  out:
  - 更新対象リスト（CVE・優先度付き）
executor:
  type: script
  reason: 依存バージョンと CVE の照合はツールで自動化できるため
effort:
  duration: 0.5
  frequency: 2
automation:
  difficulty: low
  status: automated
status: stable
