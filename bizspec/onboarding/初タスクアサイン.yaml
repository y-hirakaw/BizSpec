unit: 初タスクアサイン
aim: 新メンバーが独力でほぼ完結できる規模の初タスクを選定してアサインする
phase: spec
scope:
  - 新メンバーのスキルに合った初タスクの選定とアサイン
  - 背景・期待成果・参考情報の伝達
rule:
  - 初タスクは 1〜2 日で完結できる規模にする
  - コードベースの全体像が把握できる箇所（既存機能の小改善等）を選ぶ
  - いきなり重要な本番機能は割り当てない
link:
  up:
    - コードベース説明
  down:
    - 進捗確認
core: true
io:
  in:
    - 新メンバーのスキル情報
    - バックログ（初タスク候補）
  process:
    - 難易度・学習効果を考慮してタスクを選定
    - タスクの背景・期待成果を説明してアサイン
  out:
    - アサイン済み初タスク
executor:
  type: manual
  reason: 新メンバーのスキルと成長を考慮したタスク選定は人間の判断が必要なため
effort:
  duration: 1
  frequency: 1
automation:
  difficulty: high
  status: manual
status: stable
