unit: 環境構築支援
aim: 新メンバーの開発環境・アクセス権・ツールをセットアップする
phase: spec
job:
  - 開発環境セットアップ手順書に従って環境を構築する
  - 必要なシステム・リポジトリ・ツールへのアクセス権を付与する
  - セットアップが完了したことを確認する
rule:
  - セットアップに詰まった箇所は手順書の改善点としてフィードバックする
  - アクセス権は最小権限の原則に従う
link:
  up: []
  down:
    - コードベース説明
core: true
io:
  in:
    - セットアップ手順書
    - 入社メンバー情報
  run:
    - 手順書に従って環境構築
    - アクセス権を申請・付与
    - 動作確認
  out:
    - セットアップ済み開発環境
    - アクセス権付与完了
executor:
  type: manual
  reason: 環境への対話的な操作・権限申請プロセスに人手が必要なため
effort:
  duration: 3
  frequency: 1
automation:
  difficulty: medium
  status: partially-automated
status: stable
