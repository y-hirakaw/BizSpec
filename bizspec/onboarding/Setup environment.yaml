  - アクセス権付与完了
executor:
  type: manual
  reason: 環境への対話的な操作・権限申請プロセスに人手が必要なため
effort:
  duration: 3
  frequency: 1
automation:
  difficulty: medium
  status: partially-automated
status: stable
