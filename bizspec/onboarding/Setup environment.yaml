unit: Setup environment
aim: 新メンバーの開発環境・アクセス権・ツールをセットアップする
phase: spec
rule:
- セットアップに詰まった箇所は手順書の改善点としてフィードバックする
- アクセス権は最小権限の原則に従う
link:
  up: []
  down:
  - Codebase walkthrough
core: true
io:
  in:
  - セットアップ手順書
  - 入社メンバー情報
