unit: コードベース説明
aim: アーキテクチャ・主要コンポーネント・開発フローを新メンバーに説明する
phase: spec
job:
  - システム全体のアーキテクチャ図を使って構成を説明する
  - 主要なディレクトリ・ファイル・コンポーネントの役割を説明する
  - ブランチ戦略・PR プロセス・コーディング規約を説明する
rule:
  - 一度に詰め込みすぎず、重要なものから優先的に説明する
  - 説明後に質問時間を設ける
link:
  up:
    - 環境構築支援
  down:
    - 初タスクアサイン
core: true
io:
  in:
    - セットアップ済み開発環境
    - アーキテクチャ図・コーディング規約
  run:
    - アーキテクチャ・コンポーネントを説明
    - 開発フロー・規約を説明
  out:
    - 新メンバーのコードベース理解（確認済み）
executor:
  type: manual
  reason: 質疑応答を通じた理解確認と補足説明に人手が必要なため
effort:
  duration: 2
  frequency: 1
automation:
  difficulty: high
  status: manual
status: stable
