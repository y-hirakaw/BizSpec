  - セットアップ済み開発環境
  - アーキテクチャ図・コーディング規約
  process:
  - アーキテクチャ・コンポーネントを説明
  - 開発フロー・規約を説明
  out:
  - 新メンバーのコードベース理解（確認済み）
executor:
  type: manual
  reason: 質疑応答を通じた理解確認と補足説明に人手が必要なため
effort:
  duration: 2
  frequency: 1
automation:
  difficulty: high
  status: manual
status: stable
