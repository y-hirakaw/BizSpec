unit: Codebase walkthrough
aim: アーキテクチャ・主要コンポーネント・開発フローを新メンバーに説明する
phase: spec
scope:
- アーキテクチャと主要コンポーネントの理解促進
- 開発フロー・ブランチ戦略・規約の共有
rule:
- 一度に詰め込みすぎず、重要なものから優先的に説明する
- 説明後に質問時間を設ける
link:
