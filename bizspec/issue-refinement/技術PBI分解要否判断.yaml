unit: 技術PBI分解要否判断
aim: SP をもとに技術 PBI への細分化が必要かを判断し、必要な場合は分解案を提示する
job:
  - SP に基づいて分解要否を判定する
  - 分解が必要な場合は技術 PBI の分解案を提示する
rule:
  - SP 3 以下：この unit をスキップする
  - SP 5 / 8：複数コンポーネント・レイヤーにまたがる場合は分解を推奨する
  - SP 13 以上：必ず分解する
  - 分解の目安：実装が 1 スプリントに収まらない、または担当者が複数になるケース
link:
  up:
    - ストーリーポイント算出
  down:
    - 分解パターン選択
phase: spec
core: true
io:
  in:
    - SP 値と算出根拠
    - PBI データ（JSON）
  run:
    - SP 値に基づいて分解要否を判定する
    - 分解が必要な場合は技術 PBI の分解案を作成する
  out:
    - 分解要否の判定
    - 分解が必要な場合の技術 PBI 案リスト
executor:
  type: ai_agent
  reason: SP と技術的複雑度を組み合わせた状況判断が必要なため
