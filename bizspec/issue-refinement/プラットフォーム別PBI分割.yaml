unit: プラットフォーム別PBI分割
aim: 複数プラットフォームにまたがるPBIをプラットフォーム単位の子PBIに分割する
phase: spec
job:
  - 関与するプラットフォーム（バックエンド / フロントエンド / アプリ）を特定する
  - プラットフォームごとの実装スコープを定義する
  - 子PBI間の依存順序（BE → FE/アプリ）を記述する
rule:
  - 各子PBIは単一プラットフォームの実装のみを含む
  - バックエンドAPIを先行PBIとして切り出す場合はその旨を依存関係に明記する
  - 単独ではスプリントゴールを達成できない旨を子PBIに記述する
link:
  up:
    - 分解パターン選択
  down: []
core: true
io:
  in:
    - PBI データ（JSON）
    - 関与プラットフォームのリスト
  run:
    - 関与プラットフォームを列挙する
    - プラットフォームごとのスコープを定義する
    - 子PBIの依存順序を決定する
  out:
    - プラットフォーム別子PBI一覧（タイトル・スコープ・依存順序）
executor:
  type: ai_agent
  reason: プラットフォーム間の依存関係と実装スコープの分離には推論が必要なため
