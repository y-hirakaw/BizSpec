unit: 記載内容妥当性評価
aim: 概要・スコープ・受入基準が適切に記載されているかを評価する
job:
  - 概要が目的と背景を含んでいるか確認する
  - スコープが明示されているか確認する
  - 受入基準が具体的かつ検証可能な形で書かれているか確認する
rule:
  - 各項目を独立して評価し、不足点を具体的に指摘する
  - 「書いてあるが不十分」と「記載なし」を区別する
link:
  up:
    - Issue情報取得
  down:
    - Ready判定
phase: spec
core: true
io:
  in:
    - Issue データ（JSON）
  run:
    - 概要・スコープ・受入基準それぞれを評価基準に照らして評価する
  out:
    - 各項目の評価結果（OK / NG / 不十分）と指摘事項
executor:
  type: ai_agent
  reason: 自然言語の評価・推論が必要なため
