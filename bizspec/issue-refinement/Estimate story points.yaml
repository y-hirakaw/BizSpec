  - PBI データ（JSON）
  - 各項目の評価結果
  process:
  - 複雑度・不確実性・規模を評価して SP を算出する
  out:
  - SP 値と算出根拠
executor:
  type: ai_agent
  reason: 複雑度・不確実性の推論が必要なため
effort:
  duration: 1
  frequency: 20
automation:
  difficulty: medium
  status: manual
