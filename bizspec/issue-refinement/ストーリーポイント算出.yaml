unit: ストーリーポイント算出
aim: PBI の複雑度・不確実性・規模をもとに SP を算出する
job:
  - PBI 内容から実装の複雑度・不確実性・規模を評価する
  - フィボナッチ数列（1/2/3/5/8/13）で SP を算出する
  - 算出根拠を添える
rule:
  - Ready 判定結果に依存せず算出する（Not Ready でも見積もれる範囲で算出する）
  - SP はリリーススケジュール策定の前提となるため必須
link:
  up:
    - Ready判定
  down:
    - 技術PBI分解要否判断
phase: spec
core: true
io:
  in:
    - PBI データ（JSON）
    - 各項目の評価結果
  run:
    - 複雑度・不確実性・規模を評価して SP を算出する
  out:
    - SP 値と算出根拠
executor:
  type: ai_agent
  reason: 複雑度・不確実性の推論が必要なため
