unit: Create spike PBI
aim: 不確実性を排除してSP見積もりを正確化するためのスパイク（調査）PBIを生成する
phase: spec
scope:
- 不確実性の原因と調査項目の明確化
- タイムボックス付きスパイク PBI ドラフトの整備
rule:
- スパイクPBIのSPは3以下を目安とする
- 調査項目は具体的な問いの形式で記述する（例：「〇〇は△△で実現できるか？」）
- スパイク完了後に本PBIのリファインメントを再実施する旨を記述する
link:
  up:
  - Select split pattern
  down: []
core: false
io:
  in:
  - PBI データ（JSON）
  - 不確実性の説明
  - SP 値と見積もり根拠
  process:
  - 不確実性の原因を分析する
  - 調査項目リストを作成する
  - タイムボックスを設定する
  out:
  - スパイクPBIドラフト（タイトル・調査項目・タイムボックス）
executor:
  type: ai_agent
  reason: 不確実性の原因特定と調査項目の具体化には推論が必要なため
effort:
  duration: 1
  frequency: 3
automation:
  difficulty: high
  status: manual
