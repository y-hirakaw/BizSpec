unit: 分解パターン選択
aim: 分解が必要なIssueに対して、適用すべき分解パターンを1つ以上選択する
phase: spec
job:
  - Issueの技術的特性（複数プラットフォーム・不確実性・スコープ複雑性）を評価する
  - 適用パターンをプラットフォーム分解 / スパイク / スコープ分割から選択する
  - 複数パターンが該当する場合はすべて列挙する
rule:
  - 複数プラットフォーム（BE/FE/アプリ）にまたがる実装はプラットフォーム分解を選択
  - 不確実性が高くSP見積もりの根拠が薄い場合はスパイクを選択
  - 実装スコープが独立して分離可能（正常系/異常系・レイアウト/データ等）な場合はスコープ分割を選択
  - パターンは複数選択可能
link:
  up:
    - 技術Issue分解要否判断
  down:
    - プラットフォーム別PBI分割
    - スパイクPBI作成
    - スコープ別PBI分割
core: false
io:
  in:
    - PBI データ（JSON）
    - SP 値と技術的不確実性の説明
  run:
    - Issueの技術的特性を分析する
    - 各パターンの適用条件を評価する
    - 適用パターンリストを出力する
  out:
    - 適用パターンリスト（プラットフォーム分解 / スパイク / スコープ分割）
executor:
  type: ai_agent
  reason: Issueの技術的特性と各パターンの適用条件を照合する推論が必要なため
