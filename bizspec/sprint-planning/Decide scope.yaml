unit: Decide scope
aim: ベロシティと優先順位をもとに今スプリントに取り込む PBI セットを確定する
phase: spec
scope:
- 目安 SP に基づくスプリントスコープの確定
- チーム合意の取得
rule:
- 合計 SP が目安 SP を 20% 以上超えない
- 依存関係のある PBI は両方取り込むか両方外す
- スプリント途中のスコープ変更は原則禁止
link:
  up:
  - Prioritize backlog
  - Check velocity
  down:
  - Break down tasks
core: true
io:
  in:
  - 優先順位付きバックログ（最新）
  - 今スプリントの目安 SP
  process:
  - 優先度上位から SP 合計が目安以内になるよう PBI を選択
  - 依存関係・リスクを確認して調整
  out:
  - 今スプリントのスコープ（PBI リスト・合計 SP）
executor:
  type: manual
  reason: スコープの最終判断はチームとプロダクトオーナーの合意が必要なため
depends_on:
- issue-refinement:Ready decision
effort:
  duration: 1
  frequency: 2
automation:
  difficulty: high
  status: manual
status: stable
