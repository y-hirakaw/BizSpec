unit: ベロシティ確認
aim: 直近スプリントの実績ベロシティを把握し、今スプリントの受け入れ可能量を算出する
phase: spec
scope:
  - 直近スプリント実績に基づく平均ベロシティの算出
  - 稼働補正を加えた今スプリントの目安 SP の決定
rule:
  - 直近 3 スプリントの単純平均を使う（外れ値は除外してよい）
  - 祝日・メンバー欠員がある場合はベロシティを補正する
link:
  up: []
  down:
    - スコープ決定
core: true
io:
  in:
    - 過去スプリントの完了 SP ログ
    - 今スプリントのカレンダー・稼働人数
  process:
    - 直近 3 スプリントの SP を取得
    - 平均ベロシティを計算
    - 稼働補正を適用
  out:
    - 今スプリントの目安 SP
executor:
  type: script
  reason: 過去データの集計と計算は定型処理で自動化できるため
effort:
  duration: 0.5
  frequency: 2
automation:
  difficulty: low
  status: partially-automated
status: stable
