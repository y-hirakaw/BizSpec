unit: Break down tasks
aim: 確定した PBI をエンジニアが着手できるタスク単位に分解する
phase: spec
scope:
- PBI から着手可能なタスク粒度への分解
- 担当者・工数見積もりの付与
rule:
- 1 タスクは 1 日以内で完了できる粒度にする
- タスク間の依存関係を明示する
link:
  up:
  - Decide scope
  down:
  - Set sprint goal
core: true
io:
  in:
  - 今スプリントのスコープ（PBI リスト）
  process:
  - PBI ごとにタスクを洗い出し
  - 担当者・工数をアサイン
  out:
  - タスクリスト（担当者・工数付き）
executor:
  type: ai_agent
  reason: PBI の内容を読んでタスクに分解する判断に自然言語理解が必要なため
effort:
  duration: 1
  frequency: 2
automation:
  difficulty: medium
  status: partially-automated
status: stable
