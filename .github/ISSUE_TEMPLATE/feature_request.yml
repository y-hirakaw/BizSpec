name: Feature request
description: Suggest a new feature, CLI flag, schema field, or skill behavior
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do? What's painful or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A concrete sketch of the CLI flag, YAML field, or behavior you have in mind
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, similar tools you've seen
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - CLI command / flag
        - YAML schema (new field, new value)
        - Claude Code skill (refine / refactor)
        - viz (HTML output)
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to send a PR for this
